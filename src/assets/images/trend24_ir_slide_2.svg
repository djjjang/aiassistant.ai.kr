<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }</style></defs><rect width="1600" height="900" fill="#0F2439"/><rect x="40" y="40" width="1520" height="820" rx="16" fill="#162E4A" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 90)">  <rect width="120" height="32" rx="6" fill="#F05A22"/>  <text x="60" y="21" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">02. MARKET</text>  <text x="140" y="24" font-size="14" font-weight="700" fill="#94A3B8">TREND24 SERIES A IR PITCH DECK</text>  <text x="1400" y="24" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">화폐 단위: 원화 (KRW)</text></g><g transform="translate(100, 150)">  <text x="0" y="24" font-size="34" font-weight="900" fill="#FFFFFF">시장 기회 및 목표 시장 규모 (Market Size)</text>  <text x="0" y="54" font-size="16" font-weight="500" fill="#94A3B8">글로벌 패션 산업의 AI 디지털 전환과 빅데이터 인텔리전스 수요의 폭발적 성장</text></g><line x1="100" y1="225" x2="1500" y2="225" stroke="#2D4F7C" stroke-width="1.2"/><g transform="translate(100, 255)">  <g transform="translate(0, 0)">    <rect width="445" height="290" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <rect width="445" height="52" rx="14" fill="#1E3A8A"/>    <rect x="0" y="40" width="445" height="12" fill="#1E3A8A"/>    <text x="24" y="33" font-size="16" font-weight="800" fill="#FFFFFF">TAM (전체 시장)</text>    <text x="420" y="33" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="end">CAGR 21.4%</text>    <text x="24" y="110" font-size="48" font-weight="900" fill="#38BDF8">24.5조 원</text>    <text x="24" y="145" font-size="14" font-weight="600" fill="#CBD5E1">글로벌 패션 테크 &amp; 빅데이터 분석 시장</text>    <text x="24" y="185" font-size="13" font-weight="400" fill="#94A3B8">• 전 세계 패션 브랜드의 연간 IT/데이터 투자 규모</text>    <text x="24" y="215" font-size="13" font-weight="400" fill="#94A3B8">• 생성형 AI 도입에 따른 고성장 시장 선점</text>  </g>  <g transform="translate(477, 0)">    <rect width="445" height="290" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <rect width="445" height="52" rx="14" fill="#0369A1"/>    <rect x="0" y="40" width="445" height="12" fill="#0369A1"/>    <text x="24" y="33" font-size="16" font-weight="800" fill="#FFFFFF">SAM (유효 시장)</text>    <text x="420" y="33" font-size="13" font-weight="700" fill="#BAE6FD" text-anchor="end">핵심 타깃</text>    <text x="24" y="110" font-size="48" font-weight="900" fill="#67E8F9">5.6조 원</text>    <text x="24" y="145" font-size="14" font-weight="600" fill="#CBD5E1">글로벌 디지털 트렌드 B2B 솔루션 시장</text>    <text x="24" y="185" font-size="13" font-weight="400" fill="#94A3B8">• 패션 및 원단 제조사 전용 인텔리전스 SaaS</text>    <text x="24" y="215" font-size="13" font-weight="400" fill="#94A3B8">• 정기 구독 및 시장 예측 컨설팅 수요 시장</text>  </g>  <g transform="translate(955, 0)">    <rect width="445" height="290" rx="14" fill="#0F2439" stroke="#F05A22" stroke-width="2"/>    <rect width="445" height="52" rx="14" fill="#C2410C"/>    <rect x="0" y="40" width="445" height="12" fill="#C2410C"/>    <text x="24" y="33" font-size="16" font-weight="800" fill="#FFFFFF">SOM (수익 시장)</text>    <text x="420" y="33" font-size="13" font-weight="700" fill="#FED7AA" text-anchor="end">초기 진입 완료</text>    <text x="24" y="110" font-size="48" font-weight="900" fill="#F97316">8,700억 원</text>    <text x="24" y="145" font-size="14" font-weight="600" fill="#CBD5E1">아시아 탑티어 패션 및 제조 엔터프라이즈</text>    <text x="24" y="185" font-size="13" font-weight="400" fill="#94A3B8">• 한·일·동남아 거점 1,500개 패션 기업 타깃</text>    <text x="24" y="215" font-size="13" font-weight="400" fill="#94A3B8">• 이미 320개 사 유료 계약 확보로 PMF 검증</text>  </g></g><g transform="translate(100, 580)">  <rect width="1400" height="195" rx="14" fill="#0F2439" stroke="#2D4F7C" stroke-width="1.2"/>  <text x="30" y="38" font-size="15" font-weight="800" fill="#38BDF8">Trend24 핵심 시장 경쟁 우위 및 성장 동인 (3대 Key Drivers)</text>  <g transform="translate(30, 60)">    <g transform="translate(0, 0)">      <circle cx="16" cy="20" r="14" fill="#F05A22"/>      <text x="16" y="25" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>      <text x="42" y="20" font-size="15" font-weight="700" fill="#FFFFFF">감(직관) 중심 기획에서 AI 예측 빅데이터 기반 의사결정 체제로 전환</text>      <text x="42" y="44" font-size="13" font-weight="400" fill="#94A3B8">글로벌 SNS, 검색량, 런웨이, 원단 물성을 결합한 멀티모달 예측 정확도 91.4% 확보</text>    </g>    <g transform="translate(0, 65)">      <circle cx="16" cy="20" r="14" fill="#F05A22"/>      <text x="16" y="25" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>      <text x="42" y="20" font-size="15" font-weight="700" fill="#FFFFFF">시즌 개시 6개월 전 수요 예측을 통한 불용 재고 손실률 40% 이상 절감</text>      <text x="42" y="44" font-size="13" font-weight="400" fill="#94A3B8">원단 기획 리드타임을 기존 8주에서 5일로 단축하여 기업 고객의 영업이익률 극대화 기여</text>    </g>  </g></g></svg>