<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }</style></defs><rect width="1600" height="900" fill="#0F2439"/><rect x="40" y="40" width="1520" height="820" rx="16" fill="#162E4A" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 90)">  <rect width="120" height="32" rx="6" fill="#F05A22"/>  <text x="60" y="21" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">06. FUNDRAISING</text>  <text x="140" y="24" font-size="14" font-weight="700" fill="#94A3B8">TREND24 SERIES A IR PITCH DECK</text>  <text x="1400" y="24" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">화폐 단위: 원화 (KRW)</text></g><g transform="translate(100, 150)">  <text x="0" y="24" font-size="34" font-weight="900" fill="#FFFFFF">시리즈 A 투자 유치 및 자금 집행 계획 (Use of Funds)</text>  <text x="0" y="54" font-size="16" font-weight="500" fill="#94A3B8">시리즈 A 30억 원 유치를 통한 글로벌 시장 확장 및 핵심 AI 기술 고도화</text></g><line x1="100" y1="225" x2="1500" y2="225" stroke="#2D4F7C" stroke-width="1.2"/><g transform="translate(100, 255)">  <rect width="420" height="520" rx="14" fill="#0F2439" stroke="#F05A22" stroke-width="2"/>  <text x="30" y="45" font-size="18" font-weight="900" fill="#FFFFFF">투자 라운드 개요</text>  <text x="30" y="72" font-size="13" font-weight="600" fill="#94A3B8">Series A Investment Round</text>  <g transform="translate(30, 110)">    <text x="0" y="20" font-size="14" font-weight="600" fill="#94A3B8">목표 유치 금액</text>    <text x="0" y="60" font-size="42" font-weight="900" fill="#F05A22">30억 원</text>    <text x="0" y="90" font-size="13" font-weight="500" fill="#CBD5E1">₩ 3,000,000,000 (KRW)</text>  </g>  <line x1="30" y1="230" x2="390" y2="230" stroke="#334155" stroke-width="1"/>  <g transform="translate(30, 260)" font-size="14" fill="#CBD5E1">    <text x="0" y="20">투자 전 기업 가치(Pre) : <tspan font-weight="800" fill="#FFFFFF">150억 원</tspan></text>    <text x="0" y="55">투자 후 기업 가치(Post) : <tspan font-weight="800" fill="#38BDF8">180억 원</tspan></text>    <text x="0" y="90">발행 증권 : <tspan font-weight="700" fill="#FFFFFF">상환전환우선주 (RCPS)</tspan></text>    <text x="0" y="125">클로징 예정일 : <tspan font-weight="700" fill="#FFFFFF">2026년 4분기</tspan></text>  </g></g><g transform="translate(550, 255)">  <!-- 1 -->  <g transform="translate(0, 0)">    <rect width="950" height="118" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <circle cx="45" cy="59" r="26" fill="#0284C7"/>    <text x="45" y="66" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">40%</text>    <text x="95" y="46" font-size="18" font-weight="800" fill="#FFFFFF">AI 예측 모델 고도화 및 R&amp;D 연구개발</text>    <text x="95" y="76" font-size="13" font-weight="400" fill="#94A3B8">멀티모달 생성형 AI 원단 텍스처 렌더링 엔진 개발 및 감성 물성 예측 알고리즘 구축</text>    <text x="900" y="66" font-size="24" font-weight="900" fill="#38BDF8" text-anchor="end">12억 원</text>  </g>  <!-- 2 -->  <g transform="translate(0, 134)">    <rect width="950" height="118" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <circle cx="45" cy="59" r="26" fill="#10B981"/>    <text x="45" y="66" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">30%</text>    <text x="95" y="46" font-size="18" font-weight="800" fill="#FFFFFF">글로벌(도쿄·싱가포르·뉴욕) 시장 진출 및 해외 마케팅</text>    <text x="95" y="76" font-size="13" font-weight="400" fill="#94A3B8">일본 지사 설립, 해외 바이어 매칭 네트워크 인프라 확장 및 글로벌 패션위크 쇼케이스</text>    <text x="900" y="66" font-size="24" font-weight="900" fill="#34D399" text-anchor="end">9억 원</text>  </g>  <!-- 3 -->  <g transform="translate(0, 268)">    <rect width="950" height="118" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <circle cx="45" cy="59" r="26" fill="#F59E0B"/>    <text x="45" y="66" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">20%</text>    <text x="95" y="46" font-size="18" font-weight="800" fill="#FFFFFF">핵심 AI 엔지니어 및 도메인 전문가 영입</text>    <text x="95" y="76" font-size="13" font-weight="400" fill="#94A3B8">컴퓨터 비전 및 대규모 언어모델(LLM) 전문 연구원, 15년 차 이상 글로벌 수석 패션 MD</text>    <text x="900" y="66" font-size="24" font-weight="900" fill="#FBBF24" text-anchor="end">6억 원</text>  </g>  <!-- 4 -->  <g transform="translate(0, 402)">    <rect width="950" height="118" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <circle cx="45" cy="59" r="26" fill="#6366F1"/>    <text x="45" y="66" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">10%</text>    <text x="95" y="46" font-size="18" font-weight="800" fill="#FFFFFF">클라우드 인프라 및 운영 안정화</text>    <text x="95" y="76" font-size="13" font-weight="400" fill="#94A3B8">대용량 분산 GPU 클라우드 인프라 확충, 데이터 보안 및 엔터프라이즈 운영비 확보</text>    <text x="900" y="66" font-size="24" font-weight="900" fill="#818CF8" text-anchor="end">3억 원</text>  </g></g></svg>