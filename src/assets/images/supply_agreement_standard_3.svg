<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1200" width="850" height="1200">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    </style>
  </defs>

  <rect width="850" height="1200" fill="#FFFFFF"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="850" height="52" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(60, 32)">
    <rect x="0" y="-18" width="80" height="24" rx="4" fill="#0F172A"/>
    <text x="40" y="-2" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">T24 LEGAL</text>
    <text x="94" y="-1" font-size="12" font-weight="700" fill="#334155">B2B 물품 납품 및 자재 공급 기본계약서</text>
    <text x="325" y="-1" font-size="11" font-weight="500" fill="#64748B">| 제3면 (책임한도·비밀유지)</text>
  </g>
  <g transform="translate(790, 32)" text-anchor="end">
    <text x="0" y="-1" font-size="11" font-weight="600" fill="#64748B">문서번호: T24-SP-2026-0921</text>
  </g>

  <!-- Article 12: 제 12 조 (손해배상 책임 및 한도) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 12 조 (손해배상 책임 및 한도)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 갑 또는 을이 본 계약상 의무를 위반하여 상대방에게 직접적인 통상의 손해를 입힌 경우 이를 배상할 책임을 진다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 일방 당사자가 상대방에게 부담하는 총 손해배상 책임의 한도는 원인이 발생한 해당 개별 발주 금액을 초과하지 아니한다.
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 어떠한 경우에도 간접손해, 특별손해, 징벌적 손해, 영업손실 및 일실이익은 손해배상 청구 범위에서 명시적으로 제외한다.
    </text>
    <text x="14" y="82" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ④ 단, 손해가 배상의무자의 고의 또는 중대한 과실로 발생한 경우에는 제2항 및 제3항의 한도를 적용하지 아니한다.
    </text>
  </g>

  <!-- Article 13: 제 13 조 (제3자 권리 침해 및 제조물 책임) -->
  <g transform="translate(60, 215)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 13 조 (제3자 권리 침해 및 제조물 책임)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 을은 납품 물품이 제3자의 특허권, 실용신안권, 디자인권 등 지식재산권을 침해하지 아니함을 엄격히 보증한다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 물품과 관련하여 제3자가 지식재산권 침해 또는 제조물 결함(PL)을 이유로 갑에게 소송 등을 제기한 경우, 을은 자기 비용과
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      책임으로 갑을 방어하고 면책시켜야 한다.
    </text>
    <text x="14" y="82" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 단, 결함이나 분쟁의 원인이 갑이 독자적으로 제공한 설계 도면, 원재료 사양 또는 지시에 의한 것일 때에는 을은 면책된다.
    </text>
  </g>

  <!-- Article 14: 제 14 조 (영업비밀 보호 및 비밀유지 의무) -->
  <g transform="translate(60, 340)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 14 조 (영업비밀 보호 및 비밀유지 의무)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 갑과 을은 본 계약의 체결 및 이행 과정에서 취득한 상대방의 기술, 원가, 고객 정보 등을 계약기간 및 종료 후 3년간
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      엄격히 비밀로 유지하여야 하며, 사전 서면 동의 없이 제3자에게 누설하거나 본 계약 외의 용도로 사용하여서는 아니 된다.
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 공지된 정보, 정당하게 수령한 정보, 법령에 따른 법원·정부기관의 정당한 명령에 의해 공개되는 정보는 제외한다.
    </text>
  </g>

  <!-- Article 15: 제 15 조 (권리·의무의 양도 및 재위탁 금지) -->
  <g transform="translate(60, 445)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 15 조 (권리·의무의 양도 및 재위탁 금지)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 갑과 을은 상대방의 사전 서면 승인 없이 본 계약상 권리·의무의 전부 또는 일부를 제3자에게 양도하거나 담보로 제공할 수 없다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 을은 갑의 사전 서면 동의 없이 본 물품의 핵심 제조 공정을 제3자에게 임의로 재위탁(하도급)할 수 없다.
    </text>
  </g>

  <!-- T24 Legal Commentary Box -->
  <g transform="translate(60, 560)">
    <rect width="730" height="510" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
    <rect x="18" y="16" width="145" height="22" rx="4" fill="#D97706"/>
    <text x="90" y="31" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">T24 핵심 검토 가이드</text>
    <text x="175" y="32" font-size="13" font-weight="800" fill="#92400E">손해배상 책임 한도(Cap, 제12조) 및 제조물책임(PL) 방어 설계</text>
    
    <line x1="18" y1="48" x2="712" y2="48" stroke="#FDE68A" stroke-width="1"/>
    
    <!-- Feature 1: Liability Cap -->
    <g transform="translate(20, 68)">
      <circle cx="6" cy="6" r="4" fill="#B45309"/>
      <text x="18" y="10" font-size="12.5" font-weight="800" fill="#92400E">1. '무제한 배상책임' 배제 및 발주금액 한도(Cap) 설정 이유</text>
      <text x="18" y="30" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        독소 조항 계약서의 가장 흔한 패턴은 "을의 귀책 시 발생한 모든 손해를 배상한다"는 무제한 책임 문구입니다.
      </text>
      <text x="18" y="48" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        이 경우 몇천만 원짜리 부품 결함으로 구매처 생산라인 전체가 멈췄다는 이유로 수십억 원의 생산 손실(일실이익)을
      </text>
      <text x="18" y="66" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        청구당해 중소 제조사가 도산할 수 있습니다. 본 조항은 '해당 발주금액 한도'와 '간접손해 제외'를 확정하여
      </text>
      <text x="18" y="84" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        예측 불가능한 재무적 파탄 리스크를 원천적으로 차단합니다.
      </text>
    </g>

    <!-- Feature 2: PL Design Responsibility -->
    <g transform="translate(20, 190)">
      <circle cx="6" cy="6" r="4" fill="#B45309"/>
      <text x="18" y="10" font-size="12.5" font-weight="800" fill="#92400E">2. 제조물책임법(PL) 상의 갑/을 책임 분계점 명시 (제13조 제3항)</text>
      <text x="18" y="30" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        제조물책임법 제3조 제2항에 따라 공급업자가 발주자의 설계 지침 및 도면에 단순히 따라 제조한 경우,
      </text>
      <text x="18" y="48" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        설계상 결함에 대해 공급사는 면책될 수 있습니다. 본 계약서는 이를 계약 문구로 명문화하여 갑의 설계 오류로
      </text>
      <text x="18" y="66" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        인한 문제까지 을에게 일방 전가되는 것을 예방합니다.
      </text>
    </g>

    <!-- Feature 3: Reasonable Confidentiality -->
    <g transform="translate(20, 295)">
      <circle cx="6" cy="6" r="4" fill="#B45309"/>
      <text x="18" y="10" font-size="12.5" font-weight="800" fill="#92400E">3. 영구 비밀유지가 아닌 '종료 후 3년'의 합리적 기간 설정</text>
      <text x="18" y="30" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        '영구히 비밀을 유지한다'는 조항은 법적으로 과도한 제약으로 다툼의 소지가 큽니다. IT·제조 산업의 기술 수명 주기를
      </text>
      <text x="18" y="48" font-size="11.5" font-weight="400" fill="#78350F" letter-spacing="-0.2">
        고려하여 '계약 종료 후 3년간'으로 기한을 설정하고 법정 예외 사유를 완비했습니다.
      </text>
    </g>

    <rect x="20" y="380" width="690" height="98" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="32" y="405" font-size="12" font-weight="800" fill="#B45309">⚖ 실무 계약 체크리스트 : 책임 제한 조항 유효성 요건</text>
    <text x="32" y="425" font-size="11.5" font-weight="500" fill="#92400E">
      • 고의 또는 중과실은 법률상 면책이 불가하므로 제4항에서 명시적으로 제외하여 조항 전체의 법적 효력을 담보함.
    </text>
    <text x="32" y="445" font-size="11.5" font-weight="500" fill="#92400E">
      • 쌍방(갑과 을) 모두에게 대등하게 적용되는 '상호 손해배상 한도'로 규정하여 공정거래위원회 표준약관 기준 충족.
    </text>
    <text x="32" y="465" font-size="11.5" font-weight="700" fill="#B45309">
      → T24 법무 검토팀에서는 모든 기업 공급계약서에 해당 안전장치 3종을 기본 탑재하여 납품합니다.
    </text>
  </g>

  <!-- Page Footer -->
  <line x1="60" y1="1120" x2="790" y2="1120" stroke="#CBD5E1" stroke-width="0.8"/>
  <g transform="translate(60, 1145)">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#94A3B8">트렌드 24 (T24 AI) 실무 표준 계약서 서식집</text>
  </g>
  <g transform="translate(425, 1145)" text-anchor="middle">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#334155">- 3 / 5 -</text>
  </g>
  <g transform="translate(790, 1145)" text-anchor="end">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#94A3B8">(주)한국글로벌제조 ✕ (주)케이원인더스트리</text>
  </g>
</svg>
