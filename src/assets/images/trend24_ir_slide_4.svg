<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }</style></defs><rect width="1600" height="900" fill="#0F2439"/><rect x="40" y="40" width="1520" height="820" rx="16" fill="#162E4A" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 90)">  <rect width="120" height="32" rx="6" fill="#F05A22"/>  <text x="60" y="21" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">04. TRACTION</text>  <text x="140" y="24" font-size="14" font-weight="700" fill="#94A3B8">TREND24 SERIES A IR PITCH DECK</text>  <text x="1400" y="24" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">화폐 단위: 원화 (KRW)</text></g><g transform="translate(100, 150)">  <text x="0" y="24" font-size="34" font-weight="900" fill="#FFFFFF">성장 지표 및 핵심 실적 (Traction &amp; Milestones)</text>  <text x="0" y="54" font-size="16" font-weight="500" fill="#94A3B8">고객사 320개사 돌파 및 ARR 24억 원 달성 (검증된 제품-시장 적합성 PMF)</text></g><line x1="100" y1="225" x2="1500" y2="225" stroke="#2D4F7C" stroke-width="1.2"/><g transform="translate(100, 255)">  <g transform="translate(0, 0)">    <rect width="325" height="200" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <text x="24" y="45" font-size="14" font-weight="700" fill="#94A3B8">유료 고객사 수 (Paid Clients)</text>    <text x="24" y="105" font-size="52" font-weight="900" fill="#10B981">320개 사</text>    <text x="24" y="145" font-size="14" font-weight="700" fill="#34D399">전년 동기 대비 +280% 고속 성장</text>    <text x="24" y="172" font-size="12" font-weight="400" fill="#64748B">국내 탑5 대형 패션그룹 전사 도입</text>  </g>  <g transform="translate(355, 0)">    <rect width="325" height="200" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <text x="24" y="45" font-size="14" font-weight="700" fill="#94A3B8">연간 반복 매출 (ARR)</text>    <text x="24" y="105" font-size="52" font-weight="900" fill="#38BDF8">24억 원</text>    <text x="24" y="145" font-size="14" font-weight="700" fill="#38BDF8">월간 반복 매출 2억 원 상회</text>    <text x="24" y="172" font-size="12" font-weight="400" fill="#64748B">MoM +32% 가파른 매출 성장 곡선</text>  </g>  <g transform="translate(710, 0)">    <rect width="325" height="200" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <text x="24" y="45" font-size="14" font-weight="700" fill="#94A3B8">순매출 유지율 (NRR)</text>    <text x="24" y="105" font-size="52" font-weight="900" fill="#FBBF24">128%</text>    <text x="24" y="145" font-size="14" font-weight="700" fill="#FBBF24">월간 고객 이탈률 1.8% 미만</text>    <text x="24" y="172" font-size="12" font-weight="400" fill="#64748B">기존 고객 플랜 업그레이드 활성화</text>  </g>  <g transform="translate(1065, 0)">    <rect width="325" height="200" rx="14" fill="#0F2439" stroke="#F05A22" stroke-width="1.5"/>    <text x="24" y="45" font-size="14" font-weight="700" fill="#94A3B8">LTV / CAC 비율 (효율성)</text>    <text x="24" y="105" font-size="52" font-weight="900" fill="#F05A22">4.6배</text>    <text x="24" y="145" font-size="14" font-weight="700" fill="#FB923C">고객 획득비용 회수 5.2개월</text>    <text x="24" y="172" font-size="12" font-weight="400" fill="#64748B">글로벌 B2B SaaS 상위 10% 수준</text>  </g></g><g transform="translate(100, 490)">  <rect width="1400" height="285" rx="14" fill="#0F2439" stroke="#2D4F7C" stroke-width="1.2"/>  <text x="30" y="38" font-size="16" font-weight="800" fill="#38BDF8">분기별 핵심 마일스톤 및 성과 추진 경과 (Milestones)</text>  <g transform="translate(30, 80)">    <!-- Stage 1 -->    <g transform="translate(0, 0)">      <circle cx="24" cy="24" r="20" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>      <text x="24" y="29" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">2025.1H</text>      <text x="60" y="20" font-size="16" font-weight="800" fill="#FFFFFF">AI 트렌드 리서치 베타 서비스 런칭</text>      <text x="60" y="44" font-size="13" font-weight="400" fill="#94A3B8">초기 30개 고객사 파일럿 테스트 및 월 매출 3,000만 원 돌파</text>    </g>    <!-- Stage 2 -->    <g transform="translate(0, 75)">      <circle cx="24" cy="24" r="20" fill="#0369A1" stroke="#67E8F9" stroke-width="2"/>      <text x="24" y="29" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">2025.2H</text>      <text x="60" y="20" font-size="16" font-weight="800" fill="#FFFFFF">3D 패브릭 쇼케이스 상용화 및 탑5 패션그룹 공급</text>      <text x="60" y="44" font-size="13" font-weight="400" fill="#94A3B8">유료 고객사 150개사 확보 및 연간 ARR 12억 원 달성</text>    </g>    <!-- Stage 3 -->    <g transform="translate(0, 150)">      <circle cx="24" cy="24" r="20" fill="#C2410C" stroke="#F05A22" stroke-width="2"/>      <text x="24" y="29" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">2026.현재</text>      <text x="60" y="20" font-size="16" font-weight="800" fill="#F05A22">고객사 320개사 돌파 및 글로벌(도쿄/동남아) 진출 (시리즈 A 30억 유치)</text>      <text x="60" y="44" font-size="13" font-weight="400" fill="#94A3B8">ARR 24억 원 달성, 해외 바이어 200여 개 사 네트워크 연동 완료</text>    </g>  </g></g></svg>