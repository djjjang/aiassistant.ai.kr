<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }</style></defs><rect width="1600" height="900" fill="#0F2439"/><rect x="40" y="40" width="1520" height="820" rx="16" fill="#162E4A" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 90)">  <rect width="120" height="32" rx="6" fill="#F05A22"/>  <text x="60" y="21" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">07. EXIT &amp; VALUE</text>  <text x="140" y="24" font-size="14" font-weight="700" fill="#94A3B8">TREND24 SERIES A IR PITCH DECK</text>  <text x="1400" y="24" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">화폐 단위: 원화 (KRW)</text></g><g transform="translate(100, 150)">  <text x="0" y="24" font-size="34" font-weight="900" fill="#FFFFFF">투자 회수 및 기대 가치 (Valuation &amp; Exit Strategy)</text>  <text x="0" y="54" font-size="16" font-weight="500" fill="#94A3B8">2029년 목표 기업 가치 3,000억 원 및 코스닥(KOSDAQ) 기술특례 상장(IPO)</text></g><line x1="100" y1="225" x2="1500" y2="225" stroke="#2D4F7C" stroke-width="1.2"/><g transform="translate(100, 255)">  <g transform="translate(0, 0)">    <rect width="445" height="390" rx="14" fill="#0F2439" stroke="#38BDF8" stroke-width="1.5"/>    <text x="24" y="42" font-size="16" font-weight="800" fill="#38BDF8">01. 기업 가치 성장 로드맵</text>    <g transform="translate(24, 75)">      <text x="0" y="20" font-size="13" font-weight="600" fill="#94A3B8">시리즈 A 현재 기업 가치</text>      <text x="0" y="58" font-size="34" font-weight="900" fill="#FFFFFF">180억 원</text>      <text x="0" y="110" font-size="13" font-weight="600" fill="#94A3B8">2029년 목표 기업 가치</text>      <text x="0" y="154" font-size="42" font-weight="900" fill="#FBBF24">3,000억 원</text>      <text x="0" y="190" font-size="14" font-weight="700" fill="#10B981">약 16.6배 가치 상승 전망 (예상 IRR 72%)</text>    </g>  </g>  <g transform="translate(477, 0)">    <rect width="445" height="390" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <text x="24" y="42" font-size="16" font-weight="800" fill="#67E8F9">02. 투자 회수 (Exit) 시나리오</text>    <g transform="translate(24, 75)" font-size="13" fill="#CBD5E1">      <text x="0" y="20" font-weight="800" fill="#FFFFFF">시나리오 A: 코스닥(KOSDAQ) 상장</text>      <text x="0" y="45">• 2028년 말 기술특례 상장 예비심사 청구</text>      <text x="0" y="72">• 2029년 하반기 코스닥 상장(IPO) 완료</text>      <line x1="0" y1="100" x2="390" y2="100" stroke="#334155" stroke-width="1"/>      <text x="0" y="130" font-weight="800" fill="#FFFFFF">시나리오 B: 글로벌 전략적 M&amp;A</text>      <text x="0" y="155">• 글로벌 패션 리테일 그룹 인수 타깃</text>      <text x="0" y="182">• 글로벌 빅데이터/마켓 리서치사 지분 매각</text>    </g>  </g>  <g transform="translate(955, 0)">    <rect width="445" height="390" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <text x="24" y="42" font-size="16" font-weight="800" fill="#F05A22">03. 투자자 보호 및 기대 권리</text>    <g transform="translate(24, 75)" font-size="13" fill="#CBD5E1">      <text x="0" y="20" font-weight="800" fill="#FFFFFF">투자자 권리 보장 조항:</text>      <text x="0" y="48">• 배당 우선권 및 잔여 재산 분배 청구권</text>      <text x="0" y="76">• 동반 매도 참여권 (Tag-along Right)</text>      <text x="0" y="104">• 동반 매도 요구권 (Drag-along Right)</text>      <text x="0" y="132">• 분기별 정례 경영 실적 보고 및 감사권</text>      <text x="0" y="160">• 주요 경영 사항에 대한 사전 동의권</text>    </g>  </g></g><g transform="translate(100, 675)">  <rect width="1400" height="95" rx="12" fill="#0F2439" stroke="#2D4F7C" stroke-width="1.2"/>  <text x="30" y="38" font-size="15" font-weight="800" fill="#F05A22">공식 투자 문의 (IR Contact)</text>  <g transform="translate(30, 65)" font-size="13" fill="#CBD5E1">    <text x="0" y="0">주식회사 트렌드24 IR 총괄 TF</text>    <text x="350" y="0">이메일 : <tspan fill="#38BDF8" font-weight="700">ir@trend24.io</tspan></text>    <text x="680" y="0">대표전화 : 02-588-2401</text>    <text x="1340" y="0" text-anchor="end" fill="#94A3B8">본 문서는 비밀유지협약(NDA)에 따라 보호됩니다.</text>  </g></g></svg>