<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
    </style>
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="confGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="dealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Outer background & striped lines -->
  <rect width="1600" height="900" fill="#E2E0D8"/>
  <g stroke="#7C7A74" stroke-width="1.2">
    <line x1="60" y1="55" x2="1540" y2="55"/>
    <line x1="60" y1="67" x2="1540" y2="67"/>
    <line x1="60" y1="79" x2="1540" y2="79"/>
    <line x1="60" y1="91" x2="1540" y2="91"/>
    <line x1="60" y1="103" x2="1540" y2="103"/>
  </g>

  <!-- Main Slide Frame -->
  <rect x="50" y="105" width="1500" height="740" fill="#FAF9F5" stroke="#4A4944" stroke-width="1.5"/>

  <!-- Decorative Stars -->
  <g transform="translate(120, 180)" stroke="#9CA3AF" stroke-width="1.5" fill="none">
    <line x1="0" y1="-26" x2="0" y2="26"/>
    <line x1="-26" y1="0" x2="26" y2="0"/>
    <line x1="-18" y1="-18" x2="18" y2="18"/>
    <line x1="-18" y1="18" x2="18" y2="-18"/>
  </g>
  <g transform="translate(1480, 280)" stroke="#9CA3AF" stroke-width="1.5" fill="none">
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="-20" y1="0" x2="20" y2="0"/>
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="-14" y1="14" x2="14" y2="-14"/>
  </g>

  <!-- Center Title -->
  <text x="800" y="215" font-size="54" font-weight="900" fill="#201E1C" text-anchor="middle">비전 및 미션</text>

  <!-- 3 Photo Cards Row -->
  <!-- Card 1: Green Upward Growth Chart -->
  <g transform="translate(130, 295)">
    <rect width="400" height="240" fill="url(#growthGrad)"/>
    <!-- Financial bars & arrow -->
    <path d="M40 190 L90 160 L140 170 L210 100 L270 120 L350 40" fill="none" stroke="#6EE7B7" stroke-width="5"/>
    <polygon points="350,25 365,55 335,45" fill="#6EE7B7"/>
    <rect x="50" y="160" width="16" height="60" fill="#34D399" opacity="0.4"/>
    <rect x="100" y="140" width="16" height="80" fill="#34D399" opacity="0.5"/>
    <rect x="170" y="110" width="16" height="110" fill="#34D399" opacity="0.6"/>
    <rect x="230" y="80" width="16" height="140" fill="#34D399" opacity="0.7"/>
    <rect x="300" y="50" width="16" height="170" fill="#34D399" opacity="0.8"/>
  </g>

  <!-- Card 2: Conference Table with Docs -->
  <g transform="translate(565, 295)">
    <rect width="400" height="240" fill="url(#confGrad)"/>
    <!-- Conference room table perspective -->
    <polygon points="50,240 160,30 240,30 350,240" fill="#FDE68A" opacity="0.85"/>
    <!-- Stack of documents on table -->
    <rect x="170" y="80" width="60" height="40" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="150" y="140" width="100" height="60" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <!-- Card 3: Business Handshake -->
  <g transform="translate(1000, 295)">
    <rect width="400" height="240" fill="url(#dealGrad)"/>
    <!-- Handshake silhouette motif -->
    <circle cx="200" cy="120" r="60" fill="#FFFFFF" opacity="0.15"/>
    <path d="M120 120 L170 120 L195 140 L230 110 L280 110" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="170" cy="120" r="10" fill="#FFFFFF"/>
    <circle cx="230" cy="110" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Divider Line -->
  <line x1="90" y1="795" x2="1510" y2="795" stroke="#7E7C76" stroke-width="1.2"/>

  <!-- Bottom 3 Descriptions -->
  <g transform="translate(130, 590)">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#111827">비전</text>
    <text x="0" y="45" font-size="19" font-weight="500" fill="#374151">트렌드 분석 분야의 신뢰할 수 있는 파트너로</text>
    <text x="0" y="75" font-size="19" font-weight="500" fill="#374151">성장합니다.</text>
  </g>

  <g transform="translate(565, 590)">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#111827">미션</text>
    <text x="0" y="45" font-size="19" font-weight="500" fill="#374151">정확한 시장 정보와 실행 가능한 인사이트로</text>
    <text x="0" y="75" font-size="19" font-weight="500" fill="#374151">고객의 경쟁력을 강화합니다.</text>
  </g>

  <g transform="translate(1000, 590)">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#111827">약속</text>
    <text x="0" y="45" font-size="19" font-weight="500" fill="#374151">고객 만족도 최우선, 지속적인 혁신,</text>
    <text x="0" y="75" font-size="19" font-weight="500" fill="#374151">투명한 소통을 실천합니다.</text>
  </g>
</svg>
