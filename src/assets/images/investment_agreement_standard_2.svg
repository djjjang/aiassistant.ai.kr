<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1200" width="850" height="1200">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    </style>
  </defs>

  <rect width="850" height="1200" fill="#FFFFFF"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="850" height="52" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(60, 32)">
    <rect x="0" y="-18" width="80" height="24" rx="4" fill="#0F172A"/>
    <text x="40" y="-2" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">T24 LEGAL</text>
    <text x="94" y="-1" font-size="12" font-weight="700" fill="#334155">사업 투자 계약서 (수익배분형)</text>
    <text x="268" y="-1" font-size="11" font-weight="500" fill="#64748B">| 제2면</text>
  </g>
  <g transform="translate(790, 32)" text-anchor="end">
    <text x="0" y="-1" font-size="11" font-weight="600" fill="#64748B">문서번호: T24-INV-2026-0925</text>
  </g>

  <!-- Article 5 Continuation -->
  <g transform="translate(60, 85)" font-size="12" font-weight="400" fill="#334155">
    <text x="30" y="0">5. 제 3 자로부터 본 사업에 대한 추가 투자를 받는 경우</text>
    <text x="14" y="24" font-size="12.5" letter-spacing="-0.2">
      ③ 갑의 투자는 공동사업자로서의 지위를 갖는 것이 아니며, 본 사업으로 발생한 대외적 채무와 책임은 을이 부담한다.
    </text>
  </g>

  <!-- Article 6: 제 6 조 (수익의 산정 및 배분) -->
  <g transform="translate(60, 142)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 6 조 (수익의 산정 및 배분)</text>
    <text x="14" y="24" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 본 계약에서 "순이익"이란 정산기간 동안 본 사업에서 발생한 총매출액에서 매출원가, 인건비, 임차료, 공과금, 세금
    </text>
    <text x="14" y="44" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      (을의 소득세 제외) 등 사업 운영에 실제로 들어간 비용을 뺀 금액을 말한다.
    </text>
    <text x="14" y="66" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 을의 대표자 급여는 월 금 ____________원을 한도로 비용에 포함할 수 있다.
    </text>
    <text x="14" y="88" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 순이익은 갑 _____%, 을 _____%의 비율로 배분한다.
    </text>
    <text x="14" y="110" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ④ 정산기간은 매 □월 □분기 □반기 단위로 하며, 을은 정산기간 종료일이 속한 달의 다음 달 _____일까지 갑의 배분금을
    </text>
    <text x="14" y="130" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      갑이 지정한 계좌로 지급한다.
    </text>
    <text x="14" y="152" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ⑤ 정산기간에 순손실이 발생한 경우 해당 기간의 배분금은 없으며, 그 손실은 다음 정산기간의 순이익에서 먼저 차감한다.
    </text>
  </g>

  <!-- Article 7: 제 7 조 (투자금의 회수) -->
  <g transform="translate(60, 335)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 7 조 (투자금의 회수)</text>
    <text x="14" y="24" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 갑의 투자금은 다음 중 당사자가 선택한 방식으로 회수한다.
    </text>
    
    <g transform="translate(30, 48)" font-size="12" font-weight="400" fill="#334155">
      <text x="0" y="0">□ 1. 수익배분형: 투자금은 별도로 상환하지 않고, 계약 종료 시 제 12 조에 따라 정산한다.</text>
      <text x="0" y="24">□ 2. 우선회수형: 제 6 조의 배분과 별도로 매 정산기간 순이익의 _____%를 투자금 상환에 우선 충당하며,</text>
      <text x="24" y="44">투자금 전액이 회수된 이후에는 제 6 조 제 3 항의 배분비율을 갑 _____%, 을 _____%로 조정한다.</text>
    </g>

    <text x="14" y="120" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 본 투자는 사업의 성과에 따라 수익과 손실이 결정되는 투자로서, 을은 투자금 원금이나 확정 수익을 보장하지 않는다.
    </text>
    <text x="14" y="140" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      다만, 을의 고의 또는 중대한 과실, 투자금 용도 외 사용 등 을의 귀책사유로 손실이 발생한 경우에는 그러하지 아니하다.
    </text>
    <text x="14" y="162" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 갑의 손실 부담은 투자금을 한도로 하며, 갑은 추가 출자나 사업상 채무를 부담할 의무가 없다.
    </text>
  </g>

  <!-- Article 8: 제 8 조 (회계 및 보고) -->
  <g transform="translate(60, 535)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 8 조 (회계 및 보고)</text>
    <text x="14" y="24" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 을은 본 사업의 매출과 비용을 장부에 기록하고, 영수증·세금계산서·계좌 거래내역 등 증빙을 5년간 보관한다.
    </text>
    <text x="14" y="46" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 을은 매 정산 시 [별지 2] 양식의 정산서와 주요 증빙을 갑에게 제출한다.
    </text>
    <text x="14" y="68" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 갑은 7일 전에 통지한 후 영업시간 중에 장부와 증빙을 열람하거나 사본을 요청할 수 있으며, 갑의 비용으로 세무사 등
    </text>
    <text x="14" y="88" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      전문가에게 확인을 맡길 수 있다.
    </text>
    <text x="14" y="110" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ④ 을은 매출의 현저한 감소, 소송 제기, 행정처분 등 본 사업에 중대한 영향을 미치는 사항이 생긴 경우 지체 없이 갑에게
    </text>
    <text x="14" y="130" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      알려야 한다.
    </text>
  </g>

  <!-- Article 9: 제 9 조 (을의 진술 및 보장) -->
  <g transform="translate(60, 705)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 9 조 (을의 진술 및 보장)</text>
    <text x="14" y="24" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      을은 본 계약 체결일 현재 다음 사항이 사실임을 진술하고 보장한다.
    </text>
    
    <g transform="translate(30, 48)" font-size="12" font-weight="400" fill="#334155">
      <text x="0" y="0">1. 본 사업에 필요한 인허가와 사업자등록을 적법하게 갖추고 있다.</text>
      <text x="0" y="22">2. [별지 1]에 기재한 사항 외에 본 사업과 관련된 채무, 담보, 체납 세금이 없다.</text>
      <text x="0" y="44">3. 본 사업과 관련하여 진행 중이거나 예상되는 소송·분쟁이 없다.</text>
      <text x="0" y="66">4. 갑에게 제공한 사업계획서, 매출 자료 등은 사실과 다르지 않다.</text>
    </g>
  </g>

  <!-- Article 10: 제 10 조 (계약기간) -->
  <g transform="translate(60, 855)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 10 조 (계약기간)</text>
    <text x="14" y="24" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 본 계약의 기간은 투자금 납입일부터 _____년(_____개월)으로 한다.
    </text>
    <text x="14" y="46" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 계약기간 만료 2개월 전까지 갑과 을이 서면으로 합의한 경우 본 계약을 연장할 수 있다.
    </text>
  </g>

  <!-- Page Footer -->
  <line x1="60" y1="1130" x2="790" y2="1130" stroke="#CBD5E1" stroke-width="0.8"/>
  <g transform="translate(60, 1155)">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#94A3B8">트렌드 24 (T24 AI) 실무 표준 계약서 서식집</text>
  </g>
  <g transform="translate(425, 1155)" text-anchor="middle">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#334155">- 2 -</text>
  </g>
  <g transform="translate(790, 1155)" text-anchor="end">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#94A3B8">사업 투자 계약서 (수익배분형)</text>
  </g>
</svg>
