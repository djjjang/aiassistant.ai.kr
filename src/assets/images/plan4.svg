<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      text {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="#FFFFFF"/>

  <!-- Top Badge (4 / 7) -->
  <rect x="70" y="70" width="56" height="26" rx="13" fill="#E0E7FF"/>
  <text x="98" y="87" text-anchor="middle" fill="#4338CA" font-size="12" font-weight="700">4 / 7</text>

  <!-- Top Right Section Label -->
  <text x="730" y="87" text-anchor="end" fill="#6B7280" font-size="14" font-weight="600">성장전략 · Scale-up</text>

  <!-- Main Heading -->
  <text x="70" y="165" fill="#111827" font-size="30" font-weight="800" letter-spacing="-0.5">수도권 파일럿에서</text>
  <text x="70" y="210" fill="#111827" font-size="30" font-weight="800" letter-spacing="-0.5">전국 유통망으로</text>

  <!-- Vertical Timeline Section -->
  <g transform="translate(70, 270)">
    <!-- Connecting Line -->
    <line x1="12" y1="12" x2="12" y2="175" stroke="#D1D5DB" stroke-width="2"/>

    <!-- Step 1: 2026 -->
    <circle cx="12" cy="12" r="6" fill="#2E7D32"/>
    <text x="36" y="16" fill="#111827" font-size="16" font-weight="700">2026 · 수도권 파일럿</text>
    <text x="36" y="42" fill="#6B7280" font-size="14" font-weight="400">소상공인 대상 서비스 검증 및 초기 수거망 구축</text>

    <!-- Step 2: 2027 -->
    <circle cx="12" cy="92" r="6" fill="#2E7D32"/>
    <text x="36" y="96" fill="#111827" font-size="16" font-weight="700">2027 · 전국 확장</text>
    <text x="36" y="122" fill="#6B7280" font-size="14" font-weight="400">프랜차이즈 · 급식업체 제휴로 수거처 전국 확대</text>

    <!-- Step 3: 2028 -->
    <circle cx="12" cy="172" r="6" fill="#2E7D32"/>
    <text x="36" y="176" fill="#111827" font-size="16" font-weight="700">2028 · 원료 공급망 구축</text>
    <text x="36" y="202" fill="#6B7280" font-size="14" font-weight="400">바이오디젤 원료용 B2B 유통 채널 확보</text>
  </g>

  <!-- Stat Cards Grid (3 Columns) -->
  <g transform="translate(70, 530)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="206" height="92" rx="12" fill="#F1F5F9"/>
    <text x="103" y="44" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="800">500곳</text>
    <text x="103" y="68" text-anchor="middle" fill="#64748B" font-size="13" font-weight="500">목표 수거처</text>

    <!-- Card 2 -->
    <rect x="226" y="0" width="206" height="92" rx="12" fill="#F1F5F9"/>
    <text x="329" y="44" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="800">1,200t</text>
    <text x="329" y="68" text-anchor="middle" fill="#64748B" font-size="13" font-weight="500">연간 목표 수거량</text>

    <!-- Card 3 -->
    <rect x="452" y="0" width="208" height="92" rx="12" fill="#F1F5F9"/>
    <text x="556" y="44" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="800">70%</text>
    <text x="556" y="68" text-anchor="middle" fill="#64748B" font-size="13" font-weight="500">R&amp;D 지원금 활용</text>
  </g>

  <!-- Bottom Right Attribution -->
  <text x="730" y="1030" text-anchor="end" fill="#9CA3AF" font-size="12" font-weight="500">AI 사업계획서 작성 · 트렌드24 업무대행</text>
</svg>
