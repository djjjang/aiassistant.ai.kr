<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }</style></defs><rect width="1600" height="900" fill="#0F2439"/><rect x="40" y="40" width="1520" height="820" rx="16" fill="#162E4A" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 90)">  <rect width="120" height="32" rx="6" fill="#F05A22"/>  <text x="60" y="21" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">03. BUSINESS MODEL</text>  <text x="140" y="24" font-size="14" font-weight="700" fill="#94A3B8">TREND24 SERIES A IR PITCH DECK</text>  <text x="1400" y="24" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">화폐 단위: 원화 (KRW)</text></g><g transform="translate(100, 150)">  <text x="0" y="24" font-size="34" font-weight="900" fill="#FFFFFF">비즈니스 모델 및 수익 체계 (Revenue Model)</text>  <text x="0" y="54" font-size="16" font-weight="500" fill="#94A3B8">안정적 반복 매출(ARR)의 B2B 정기 구독과 고단가 프로젝트형 컨설팅의 시너지</text></g><line x1="100" y1="225" x2="1500" y2="225" stroke="#2D4F7C" stroke-width="1.2"/><g transform="translate(100, 255)">  <g transform="translate(0, 0)">    <rect width="445" height="520" rx="14" fill="#0F2439" stroke="#38BDF8" stroke-width="1.5"/>    <rect width="445" height="56" rx="14" fill="#0369A1"/>    <rect x="0" y="44" width="445" height="12" fill="#0369A1"/>    <text x="24" y="35" font-size="16" font-weight="800" fill="#FFFFFF">01. B2B 엔터프라이즈 정기 구독</text>    <text x="420" y="35" font-size="12" font-weight="700" fill="#BAE6FD" text-anchor="end">매출 비중 65%</text>    <g transform="translate(24, 75)">      <rect width="397" height="90" rx="8" fill="rgba(56,189,248,0.08)" stroke="#0284C7" stroke-width="1"/>      <text x="18" y="32" font-size="13" font-weight="700" fill="#38BDF8">표준 월간 / 연간 구독료 (원화)</text>      <text x="18" y="66" font-size="26" font-weight="900" fill="#FFFFFF">월 160만 ~ 480만 원</text>      <text x="380" y="65" font-size="12" font-weight="700" fill="#F05A22" text-anchor="end">연 1,800만~5,500만 원</text>    </g>    <g transform="translate(24, 185)" font-size="13" fill="#CBD5E1">      <text x="0" y="20" font-weight="700" fill="#FFFFFF">제공 서비스 핵심 구성:</text>      <text x="0" y="50">• 24/7 실시간 글로벌 패션 트렌드 데이터 피드</text>      <text x="0" y="80">• 차기 시즌 원단·패브릭 수요 예측 대시보드</text>      <text x="0" y="110">• C-레벨 전용 맞춤형 산업 브리핑 리포트</text>      <text x="0" y="140">• 팀 계정 다중 접속 및 API 데이터 연동 지원</text>      <text x="0" y="175" font-weight="700" fill="#38BDF8">핵심 성과: 순매출 유지율(NRR) 128%</text>      <text x="0" y="205" fill="#94A3B8">월간 고객 이탈률 1.8% 미만의 강력한 락인(Lock-in)</text>    </g>  </g>  <g transform="translate(477, 0)">    <rect width="445" height="520" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <rect width="445" height="56" rx="14" fill="#1E3A8A"/>    <rect x="0" y="44" width="445" height="12" fill="#1E3A8A"/>    <text x="24" y="35" font-size="16" font-weight="800" fill="#FFFFFF">02. 맞춤형 인텔리전스 &amp; 컨설팅</text>    <text x="420" y="35" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="end">매출 비중 25%</text>    <g transform="translate(24, 75)">      <rect width="397" height="90" rx="8" fill="rgba(30,58,138,0.2)" stroke="#1D4ED8" stroke-width="1"/>      <text x="18" y="32" font-size="13" font-weight="700" fill="#60A5FA">프로젝트 용역 건당 단가 (원화)</text>      <text x="18" y="66" font-size="26" font-weight="900" fill="#FFFFFF">건당 2,500만 ~ 6,500만 원</text>      <text x="380" y="65" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">영업이익률 48%</text>    </g>    <g transform="translate(24, 185)" font-size="13" fill="#CBD5E1">      <text x="0" y="20" font-weight="700" fill="#FFFFFF">제공 서비스 핵심 구성:</text>      <text x="0" y="50">• 특정 브랜드 타깃 타당성 분석 및 리서치</text>      <text x="0" y="80">• 글로벌(미주/유럽) 바이어 맞춤 수출 전략 기획</text>      <text x="0" y="110">• 기업 전용 AI 모델 파인튜닝 및 온프레미스 구축</text>      <text x="0" y="140">• 평균 수행기간 4주 내 고품질 완성본 납품</text>      <text x="0" y="175" font-weight="700" fill="#60A5FA">핵심 고객: 국내외 탑5 대기업 패션 그룹</text>      <text x="0" y="205" fill="#94A3B8">연간 재계약율 85% 이상의 높은 신뢰도</text>    </g>  </g>  <g transform="translate(955, 0)">    <rect width="445" height="520" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.5"/>    <rect width="445" height="56" rx="14" fill="#C2410C"/>    <rect x="0" y="44" width="445" height="12" fill="#C2410C"/>    <text x="24" y="35" font-size="16" font-weight="800" fill="#FFFFFF">03. 디지털 쇼케이스 매칭 수수료</text>    <text x="420" y="35" font-size="12" font-weight="700" fill="#FED7AA" text-anchor="end">매출 비중 10%</text>    <g transform="translate(24, 75)">      <rect width="397" height="90" rx="8" fill="rgba(240,90,34,0.1)" stroke="#EA580C" stroke-width="1"/>      <text x="18" y="32" font-size="13" font-weight="700" fill="#FB923C">플랫폼 거래 매칭 수수료 (원화)</text>      <text x="18" y="66" font-size="26" font-weight="900" fill="#FFFFFF">거래 대금의 3.5% ~ 5.0%</text>      <text x="380" y="65" font-size="12" font-weight="700" fill="#F05A22" text-anchor="end">건당 150만~800만 원</text>    </g>    <g transform="translate(24, 185)" font-size="13" fill="#CBD5E1">      <text x="0" y="20" font-weight="700" fill="#FFFFFF">제공 서비스 핵심 구성:</text>      <text x="0" y="50">• 3D 디지털 패브릭 쇼케이스 등록 및 전시</text>      <text x="0" y="80">• 글로벌 바이어와 국내 원단 공급사 1:1 직매칭</text>      <text x="0" y="110">• 안전 결제 에스크로 및 품질 보증 계약 중개</text>      <text x="0" y="140">• 스마트 수출 물류 파트너십 연계</text>      <text x="0" y="175" font-weight="700" fill="#FB923C">차세대 성장 엔진: B2B 거래 트랜잭션 수수료</text>      <text x="0" y="205" fill="#94A3B8">2027년부터 연간 거래액 500억 원 이상 타깃</text>    </g>  </g></g></svg>