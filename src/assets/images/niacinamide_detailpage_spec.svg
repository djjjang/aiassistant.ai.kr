<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="600" height="48" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="30" y="30" fill="#64748B" font-size="11" font-weight="800">BT24 · 이커머스 상세페이지</text>
  <text x="570" y="30" fill="#00796B" font-size="11" font-weight="700" text-anchor="end">Section 03 : 제품 제원 &amp; 고객센터</text>

  <!-- POINT 02 Section -->
  <g transform="translate(30, 68)">
    <text x="0" y="16" fill="#00796B" font-size="13" font-weight="800" letter-spacing="1">POINT 02</text>
    <text x="0" y="44" fill="#0F172A" font-size="22" font-weight="900">젊음으로 리턴! 세월을 지워주는 성분</text>

    <!-- 4 Feature Cards -->
    <g transform="translate(0, 58)">
      <g transform="translate(0, 0)">
        <rect width="540" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="12" y="9" width="30" height="28" rx="4" fill="#00796B" />
        <text x="27" y="28" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">01</text>
        <text x="52" y="28" fill="#1E293B" font-size="12" font-weight="700">기능성 화장품 미백 라인의 대표 성분이며 안정성 높은 성분</text>
      </g>

      <g transform="translate(0, 52)">
        <rect width="540" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="12" y="9" width="30" height="28" rx="4" fill="#00796B" />
        <text x="27" y="28" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">02</text>
        <text x="52" y="28" fill="#1E293B" font-size="12" font-weight="700">미백 / 다크서클 / 기미 / 잡티 나이흔적 / 여드름 흔적 개선</text>
      </g>

      <g transform="translate(0, 104)">
        <rect width="540" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="12" y="9" width="30" height="28" rx="4" fill="#00796B" />
        <text x="27" y="28" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">03</text>
        <text x="52" y="28" fill="#1E293B" font-size="12" font-weight="700">내가 사용하는 화장품에 섞어서 사용 가능 1회 적정양은 1펌프</text>
      </g>

      <g transform="translate(0, 156)">
        <rect width="540" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="12" y="9" width="30" height="28" rx="4" fill="#00796B" />
        <text x="27" y="28" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">04</text>
        <text x="52" y="28" fill="#1E293B" font-size="12" font-weight="700">일반 화장품도 고퀄리티 기능성으로 바뀌는 비타민 유도체</text>
      </g>
    </g>
  </g>

  <!-- Product Detail Spec Table -->
  <g transform="translate(30, 350)">
    <rect width="540" height="28" fill="#F8FAFC" />
    <text x="12" y="19" fill="#0F172A" font-size="12" font-weight="900">NIACIN 100 ampoule Powder</text>
    <text x="528" y="19" fill="#00796B" font-size="12" font-weight="700" font-style="italic" text-anchor="end">Detail information</text>

    <!-- Table Container (5 Rows) -->
    <g transform="translate(0, 36)">
      <rect width="540" height="180" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <line x1="120" y1="0" x2="120" y2="180" stroke="#CBD5E1" stroke-width="1" />

      <!-- Row 1 -->
      <rect x="0" y="0" width="120" height="36" fill="#00796B" />
      <text x="60" y="23" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">피부 타입</text>
      <text x="140" y="23" fill="#334155" font-size="11.5">악건성</text>
      <text x="235" y="23" fill="#334155" font-size="11.5">건성</text>
      <text x="330" y="23" fill="#334155" font-size="11.5">지성</text>
      <text x="430" y="23" fill="#00796B" font-size="11.5" font-weight="800">복합성 (전 피부)</text>
      <line x1="0" y1="36" x2="540" y2="36" stroke="#E2E8F0" stroke-width="1" />

      <!-- Row 2 -->
      <rect x="0" y="36" width="120" height="36" fill="#00796B" />
      <text x="60" y="59" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">목적</text>
      <text x="140" y="59" fill="#334155" font-size="11.5">진정/트러블</text>
      <text x="250" y="59" fill="#334155" font-size="11.5">보습</text>
      <text x="340" y="59" fill="#334155" font-size="11.5">영양/탄력</text>
      <text x="450" y="59" fill="#00796B" font-size="11.5" font-weight="800">브라이트닝</text>
      <line x1="0" y1="72" x2="540" y2="72" stroke="#E2E8F0" stroke-width="1" />

      <!-- Row 3 -->
      <rect x="0" y="72" width="120" height="36" fill="#00796B" />
      <text x="60" y="95" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">보관 방법</text>
      <text x="180" y="95" fill="#334155" font-size="11.5">냉장 보관</text>
      <text x="360" y="95" fill="#00796B" font-size="11.5" font-weight="800">실온 보관 (열·빛 안정성)</text>
      <line x1="0" y1="108" x2="540" y2="108" stroke="#E2E8F0" stroke-width="1" />

      <!-- Row 4 -->
      <rect x="0" y="108" width="120" height="36" fill="#00796B" />
      <text x="60" y="131" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">사용 빈도</text>
      <text x="160" y="131" fill="#00796B" font-size="11.5" font-weight="800">데일리 케어 (매일 사용)</text>
      <text x="360" y="131" fill="#334155" font-size="11.5">스페셜 케어 (2~3일 주기)</text>
      <line x1="0" y1="144" x2="540" y2="144" stroke="#E2E8F0" stroke-width="1" />

      <!-- Row 5 -->
      <rect x="0" y="144" width="120" height="36" fill="#00796B" />
      <text x="60" y="167" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">제형</text>
      <text x="180" y="167" fill="#334155" font-size="11.5">액상 타입</text>
      <text x="360" y="167" fill="#00796B" font-size="11.5" font-weight="900">파우더 (초미세 분말)</text>
    </g>
  </g>

  <!-- Customer Service Block -->
  <g transform="translate(30, 590)">
    <rect width="540" height="230" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(20, 20)">
      <text x="0" y="16" fill="#00796B" font-size="13" font-weight="900">Customer Information 고객 서비스 안내사항</text>
      
      <!-- Flow -->
      <g transform="translate(0, 32)">
        <text x="0" y="16" fill="#1E293B" font-size="11" font-weight="700">
          [상품구매] ➔ [제품검수] ➔ [제품출고] ➔ [배송완료 (결제 후 2~4일 / 무료배송)]
        </text>
      </g>

      <line x1="0" y1="64" x2="500" y2="64" stroke="#CBD5E1" stroke-width="0.8" />

      <g transform="translate(0, 80)">
        <text x="0" y="16" fill="#0F172A" font-size="13" font-weight="900">고객센터 1577-8132</text>
        <text x="140" y="16" fill="#64748B" font-size="11">평일 10:00 ~ 17:00 (점심시간 12:00 ~ 13:00 / 주말·공휴일 휴무)</text>

        <text x="0" y="44" fill="#334155" font-size="10.5" letter-spacing="-0.2">
          • 구매 후 7일 이내에 신청한 경우에만 교환 및 반품이 가능합니다.
        </text>
        <text x="0" y="60" fill="#334155" font-size="10.5" letter-spacing="-0.2">
          • 패키지 및 제품 박스 동봉 반송 필수 / 고객 부주의 파손 시 환불 불가
        </text>
        <text x="0" y="76" fill="#00796B" font-size="10.5" font-weight="700" letter-spacing="-0.2">
          • 주문 취소 요청은 오전 9시 이전 접수 시 당일 취소 처리가 가능합니다.
        </text>
      </g>
    </g>
  </g>
</svg>
