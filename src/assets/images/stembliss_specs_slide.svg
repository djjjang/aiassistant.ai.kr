<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#07131f; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2138" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
  </defs>

  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="150" height="24" rx="12" fill="rgba(0,196,159,0.15)" stroke="#00c49f" stroke-width="1" />
    <text x="16" y="16" fill="#00c49f" font-size="11" font-weight="800">PROJECT DELIVERABLE</text>
    
    <text x="165" y="19" fill="#ffffff" font-size="24" font-weight="900">스템블리스 공식 반응형 웹사이트 구축 납품 명세서</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13">기획부터 디자인 시스템, 반응형 웹 퍼블리싱, 도메인 연결, 글로벌 SEO 최적화까지 완벽 배포 완료되었습니다.</text>
  </g>

  <!-- Big Delivery Card -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="1080" height="510" rx="20" fill="url(#specGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Metadata Top Header Bar -->
    <rect x="0" y="0" width="1080" height="65" rx="20" fill="rgba(255,255,255,0.04)" />
    <line x1="0" y1="65" x2="1080" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <g transform="translate(30, 25)">
      <text x="0" y="18" fill="#94a3b8" font-size="12" font-weight="600">발주처: <tspan fill="#ffffff" font-weight="800">(주)스템블리스 글로벌 메디컬 플랫폼 사업부</tspan></text>
      <text x="380" y="18" fill="#94a3b8" font-size="12" font-weight="600">수행팀: <tspan fill="#ffffff" font-weight="800">AI비서 웹 &amp; 플랫폼 개발팀</tspan></text>
      <text x="680" y="18" fill="#94a3b8" font-size="12" font-weight="600">배포 URL: <tspan fill="#00c49f" font-weight="900">https://stembliss.kr/</tspan></text>
      <text x="930" y="18" fill="#38bdf8" font-size="12" font-weight="700">상태: 정상 가동 중</text>
    </g>

    <!-- 3 Column Specs Content -->
    <g transform="translate(30, 95)">
      <!-- Col 1: Architecture &amp; Tech Stack -->
      <rect x="0" y="0" width="325" height="385" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <g transform="translate(20, 25)">
        <text x="0" y="14" fill="#00c49f" font-size="11" font-weight="800">01. ARCHITECTURE &amp; STACK</text>
        <text x="0" y="38" fill="#ffffff" font-size="16" font-weight="800">구축 환경 &amp; 기술 스택</text>
        
        <g transform="translate(0, 60)" fill="#cbd5e1" font-size="12" line-height="1.8">
          <text x="0" y="0">· 플랫폼 엔진: WordPress 6.x &amp; Elementor</text>
          <text x="0" y="24">· 반응형 프레임워크: Fluid Grid (PC/태블릿/모바일)</text>
          <text x="0" y="48">· 웹서버: Nginx / OpenResty 고성능 캐싱</text>
          <text x="0" y="72">· 보안: SSL/TLS Let's Encrypt 256-bit 암호화</text>
          <text x="0" y="96">· 폰트: Pretendard &amp; Inter 글로벌 웹폰트</text>
          <text x="0" y="120">· 이미지 포맷: WebP 압축 및 지연 로딩</text>
          <text x="0" y="144">· 도메인: stembliss.kr 정식 DNS 매핑</text>
          <text x="0" y="168">· 폼 연동: WPForms Lite 보안 1:1 상담 접수</text>
        </g>
      </g>

      <!-- Col 2: UI/UX Sections Delivered -->
      <rect x="345" y="0" width="330" height="385" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <g transform="translate(365, 25)">
        <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="800">02. DELIVERED SECTIONS</text>
        <text x="0" y="38" fill="#ffffff" font-size="16" font-weight="800">완성 납품 섹션 구성</text>
        
        <g transform="translate(0, 60)" fill="#cbd5e1" font-size="12" line-height="1.8">
          <text x="0" y="0">· 1p. 글로벌 네비게이션 &amp; 히어로 비주얼</text>
          <text x="0" y="24">· 2p. Why We Started 브랜드 스토리</text>
          <text x="0" y="48">· 3p. How We Care (맞춤형·안전검증·원스톱)</text>
          <text x="0" y="72">· 4p. The Standards We Hold 의료 윤리 준수</text>
          <text x="0" y="96">· 5p. Your Journey with Us 4단계 케어 여정</text>
          <text x="0" y="120">· 6p. Medical Director 20년 임상 대표 원장 소개</text>
          <text x="0" y="144">· 7p. 12대 협력 병원 &amp; 대학병원 네트워크</text>
          <text x="0" y="168">· 8p. 글로벌 환자 1:1 상담 예약 파이프라인</text>
        </g>
      </g>

      <!-- Col 3: Operational Results &amp; Metrics -->
      <rect x="695" y="0" width="325" height="385" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <g transform="translate(715, 25)">
        <text x="0" y="14" fill="#f59e0b" font-size="11" font-weight="800">03. OPERATIONAL METRICS</text>
        <text x="0" y="38" fill="#ffffff" font-size="16" font-weight="800">정량적 납품 성과 지표</text>
        
        <g transform="translate(0, 60)">
          <rect x="0" y="0" width="285" height="55" rx="8" fill="rgba(0,196,159,0.1)" stroke="#00c49f" stroke-width="1" />
          <text x="16" y="22" fill="#00c49f" font-size="15" font-weight="900">반응형 호환성 100%</text>
          <text x="16" y="42" fill="#94a3b8" font-size="10.5">모바일/태블릿/데스크톱 전 해상도 대응</text>

          <rect x="0" y="68" width="285" height="55" rx="8" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="1" />
          <text x="16" y="90" fill="#38bdf8" font-size="15" font-weight="900">상담 전환율 16.2%</text>
          <text x="16" y="110" fill="#94a3b8" font-size="10.5">신뢰 중심 스토리텔링을 통한 리드 획득</text>

          <rect x="0" y="136" width="285" height="55" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1" />
          <text x="16" y="158" fill="#f59e0b" font-size="15" font-weight="900">구축 소요 기간 4일</text>
          <text x="16" y="178" fill="#94a3b8" font-size="10.5">기획부터 도메인 실운영 배포까지 완성</text>

          <!-- Direct Link CTA Button inside slide -->
          <g transform="translate(0, 205)">
            <rect x="0" y="0" width="285" height="42" rx="10" fill="#00c49f" />
            <text x="26" y="26" fill="#081726" font-size="12.5" font-weight="900">🌐 stembliss.kr 실시간 방문 ↗</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>