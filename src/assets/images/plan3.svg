<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      text {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="#FFFFFF"/>

  <!-- Top Badge (3 / 7) -->
  <rect x="70" y="70" width="56" height="26" rx="13" fill="#FEF3C7"/>
  <text x="98" y="87" text-anchor="middle" fill="#B45309" font-size="12" font-weight="700">3 / 7</text>

  <!-- Top Right Section Label -->
  <text x="730" y="87" text-anchor="end" fill="#6B7280" font-size="14" font-weight="600">실현가능성 · Solution</text>

  <!-- Main Heading -->
  <text x="70" y="165" fill="#111827" font-size="30" font-weight="800" letter-spacing="-0.5">실시간 매칭으로</text>
  <text x="70" y="210" fill="#111827" font-size="30" font-weight="800" letter-spacing="-0.5">수거 효율을 높입니다</text>

  <!-- 3-Step Process Flow -->
  <!-- Step 1: 배출처 등록 -->
  <circle cx="200" cy="310" r="38" fill="#D7F3E3"/>
  <!-- Location Pin Icon -->
  <g transform="translate(186, 294)" fill="none" stroke="#1B8748" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
    <circle cx="12" cy="9" r="2.5"/>
  </g>
  <text x="200" y="375" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">배출처 등록</text>

  <!-- Arrow 1 -->
  <g stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="280" y1="310" x2="325" y2="310"/>
    <polyline points="318,303 327,310 318,317"/>
  </g>

  <!-- Step 2: AI 매칭 -->
  <circle cx="400" cy="310" r="38" fill="#2563EB"/>
  <!-- AI Sparkle Icon -->
  <g transform="translate(386, 296)" fill="#FFFFFF">
    <path d="M14 0L17.5 9.5L27 13L17.5 16.5L14 26L10.5 16.5L1 13L10.5 9.5L14 0Z"/>
  </g>
  <text x="400" y="375" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">AI 매칭</text>

  <!-- Arrow 2 -->
  <g stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="475" y1="310" x2="520" y2="310"/>
    <polyline points="513,303 522,310 513,317"/>
  </g>

  <!-- Step 3: 수거 · 정산 -->
  <circle cx="600" cy="310" r="38" fill="#D7F3E3"/>
  <!-- Checkmark Icon -->
  <g transform="translate(586, 296)" fill="none" stroke="#1B8748" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </g>
  <text x="600" y="375" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">수거 · 정산</text>

  <!-- Flow Description Text -->
  <text x="70" y="450" fill="#4B5563" font-size="15" font-weight="400">
    <tspan x="70" dy="0">위치 기반 알고리즘으로 배출처와 수거업체를 실시간으로 연결하고, 수거 요청부터 정산까지 전</tspan>
    <tspan x="70" dy="26">과정을 자동화하여 수거 효율을 높입니다.</tspan>
  </text>

  <!-- Feature Checklist Items -->
  <!-- Check 1 -->
  <g transform="translate(70, 530)">
    <circle cx="12" cy="12" r="12" fill="#D7F3E3"/>
    <polyline points="8,12 11,15 16,9" fill="none" stroke="#1B8748" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="17" fill="#1F2937" font-size="15" font-weight="600">실시간 위치 기반 매칭</text>
  </g>

  <!-- Check 2 -->
  <g transform="translate(70, 575)">
    <circle cx="12" cy="12" r="12" fill="#D7F3E3"/>
    <polyline points="8,12 11,15 16,9" fill="none" stroke="#1B8748" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="17" fill="#1F2937" font-size="15" font-weight="600">자동 정산 및 정산 리포트</text>
  </g>

  <!-- Check 3 -->
  <g transform="translate(70, 620)">
    <circle cx="12" cy="12" r="12" fill="#D7F3E3"/>
    <polyline points="8,12 11,15 16,9" fill="none" stroke="#1B8748" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="17" fill="#1F2937" font-size="15" font-weight="600">수거 이력 데이터 관리</text>
  </g>

  <!-- Bottom Right Attribution -->
  <text x="730" y="1030" text-anchor="end" fill="#9CA3AF" font-size="12" font-weight="500">AI 사업계획서 작성 · 트렌드24 업무대행</text>
</svg>
