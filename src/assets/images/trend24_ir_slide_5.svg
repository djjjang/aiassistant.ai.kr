<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }</style></defs><rect width="1600" height="900" fill="#0F2439"/><rect x="40" y="40" width="1520" height="820" rx="16" fill="#162E4A" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 90)">  <rect width="120" height="32" rx="6" fill="#F05A22"/>  <text x="60" y="21" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">05. FINANCIALS</text>  <text x="140" y="24" font-size="14" font-weight="700" fill="#94A3B8">TREND24 SERIES A IR PITCH DECK</text>  <text x="1400" y="24" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">화폐 단위: 원화 (KRW)</text></g><g transform="translate(100, 150)">  <text x="0" y="24" font-size="34" font-weight="900" fill="#FFFFFF">재무 계획 및 4개년 매출 전망 (Financial Forecast)</text>  <text x="0" y="54" font-size="16" font-weight="500" fill="#94A3B8">2026년 35억 원에서 2029년 650억 원 달성 로드맵 (화폐 단위: 원화 KRW / 억원)</text></g><line x1="100" y1="225" x2="1500" y2="225" stroke="#2D4F7C" stroke-width="1.2"/><g transform="translate(100, 255)">  <!-- 2026 -->  <g transform="translate(0, 0)">    <rect width="325" height="520" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <text x="24" y="38" font-size="18" font-weight="900" fill="#FFFFFF">2026년 (1차년도)</text>    <text x="24" y="62" font-size="13" font-weight="600" fill="#94A3B8">국내 시장 안착 &amp; PMF 검증</text>    <!-- Bar chart visual -->    <rect x="24" y="320" width="120" height="120" rx="6" fill="#0284C7"/>    <rect x="160" y="400" width="120" height="40" rx="6" fill="#10B981"/>    <line x1="24" y1="445" x2="300" y2="445" stroke="#334155" stroke-width="1"/>    <text x="84" y="305" font-size="18" font-weight="900" fill="#38BDF8" text-anchor="middle">35억</text>    <text x="220" y="385" font-size="16" font-weight="900" fill="#34D399" text-anchor="middle">5.2억</text>    <g transform="translate(24, 465)" font-size="13" fill="#CBD5E1">      <text x="0" y="15">매출액 : <tspan font-weight="800" fill="#FFFFFF">35억 원</tspan></text>      <text x="0" y="38">영업이익 : <tspan font-weight="800" fill="#10B981">5.2억 원</tspan> (15%)</text>    </g>  </g>  <!-- 2027 -->  <g transform="translate(355, 0)">    <rect width="325" height="520" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <text x="24" y="38" font-size="18" font-weight="900" fill="#FFFFFF">2027년 (2차년도)</text>    <text x="24" y="62" font-size="13" font-weight="600" fill="#94A3B8">아시아(일본·동남아) 확장</text>    <!-- Bar chart visual -->    <rect x="24" y="240" width="120" height="200" rx="6" fill="#0284C7"/>    <rect x="160" y="340" width="120" height="100" rx="6" fill="#10B981"/>    <line x1="24" y1="445" x2="300" y2="445" stroke="#334155" stroke-width="1"/>    <text x="84" y="225" font-size="18" font-weight="900" fill="#38BDF8" text-anchor="middle">110억</text>    <text x="220" y="325" font-size="16" font-weight="900" fill="#34D399" text-anchor="middle">28.0억</text>    <g transform="translate(24, 465)" font-size="13" fill="#CBD5E1">      <text x="0" y="15">매출액 : <tspan font-weight="800" fill="#FFFFFF">110억 원</tspan></text>      <text x="0" y="38">영업이익 : <tspan font-weight="800" fill="#10B981">28.0억 원</tspan> (25%)</text>    </g>  </g>  <!-- 2028 -->  <g transform="translate(710, 0)">    <rect width="325" height="520" rx="14" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <text x="24" y="38" font-size="18" font-weight="900" fill="#FFFFFF">2028년 (3차년도)</text>    <text x="24" y="62" font-size="13" font-weight="600" fill="#94A3B8">북미 엔터프라이즈 진출</text>    <!-- Bar chart visual -->    <rect x="24" y="150" width="120" height="290" rx="6" fill="#0284C7"/>    <rect x="160" y="270" width="120" height="170" rx="6" fill="#10B981"/>    <line x1="24" y1="445" x2="300" y2="445" stroke="#334155" stroke-width="1"/>    <text x="84" y="135" font-size="18" font-weight="900" fill="#38BDF8" text-anchor="middle">280억</text>    <text x="220" y="255" font-size="16" font-weight="900" fill="#34D399" text-anchor="middle">84.0억</text>    <g transform="translate(24, 465)" font-size="13" fill="#CBD5E1">      <text x="0" y="15">매출액 : <tspan font-weight="800" fill="#FFFFFF">280억 원</tspan></text>      <text x="0" y="38">영업이익 : <tspan font-weight="800" fill="#10B981">84.0억 원</tspan> (30%)</text>    </g>  </g>  <!-- 2029 -->  <g transform="translate(1065, 0)">    <rect width="325" height="520" rx="14" fill="#0F2439" stroke="#F05A22" stroke-width="2"/>    <text x="24" y="38" font-size="18" font-weight="900" fill="#FFFFFF">2029년 (4차년도)</text>    <text x="24" y="62" font-size="13" font-weight="700" fill="#F05A22">글로벌 1위 패션 테크 도약</text>    <!-- Bar chart visual -->    <rect x="24" y="60" width="120" height="380" rx="6" fill="#F05A22"/>    <rect x="160" y="180" width="120" height="260" rx="6" fill="#10B981"/>    <line x1="24" y1="445" x2="300" y2="445" stroke="#334155" stroke-width="1"/>    <text x="84" y="45" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">650억</text>    <text x="220" y="165" font-size="18" font-weight="900" fill="#34D399" text-anchor="middle">225.0억</text>    <g transform="translate(24, 465)" font-size="13" fill="#CBD5E1">      <text x="0" y="15">매출액 : <tspan font-weight="800" fill="#F05A22">650억 원</tspan></text>      <text x="0" y="38">영업이익 : <tspan font-weight="800" fill="#10B981">225.0억 원</tspan> (35%)</text>    </g>  </g></g></svg>