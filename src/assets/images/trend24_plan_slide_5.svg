<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
    </style>
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="payGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Outer background & striped lines -->
  <rect width="1600" height="900" fill="#E2E0D8"/>
  <g stroke="#7C7A74" stroke-width="1.2">
    <line x1="60" y1="55" x2="1540" y2="55"/>
    <line x1="60" y1="67" x2="1540" y2="67"/>
    <line x1="60" y1="79" x2="1540" y2="79"/>
    <line x1="60" y1="91" x2="1540" y2="91"/>
    <line x1="60" y1="103" x2="1540" y2="103"/>
  </g>

  <!-- Main Slide Frame -->
  <rect x="50" y="105" width="1500" height="740" fill="#FAF9F5" stroke="#4A4944" stroke-width="1.5"/>

  <!-- Top Right Title -->
  <text x="1480" y="195" font-size="52" font-weight="900" fill="#201E1C" text-anchor="end">수익 모델</text>

  <!-- Middle Left Photo Cards -->
  <!-- Card 1: Signing Document with Fountain Pen -->
  <g transform="translate(120, 150)">
    <rect width="320" height="300" fill="url(#signGrad)"/>
    <!-- Paper lines and fountain pen signature -->
    <rect x="30" y="40" width="260" height="220" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="50" y1="70" x2="240" y2="70" stroke="#94A3B8" stroke-width="2"/>
    <line x1="50" y1="100" x2="210" y2="100" stroke="#94A3B8" stroke-width="2"/>
    <line x1="50" y1="130" x2="230" y2="130" stroke="#94A3B8" stroke-width="2"/>
    <!-- Signature flourish in black -->
    <path d="M60 210 Q90 170 120 220 T180 190 Q220 230 250 200" fill="none" stroke="#0F172A" stroke-width="3"/>
    <!-- Fountain pen -->
    <polygon points="210,130 240,100 245,105 215,135" fill="#334155"/>
    <polygon points="215,135 208,142 210,135" fill="#D97706"/>
  </g>

  <!-- Card 2: Smartphone Payment Screen -->
  <g transform="translate(450, 150)">
    <rect width="450" height="300" fill="#1E293B"/>
    <!-- Smartphone frame -->
    <rect x="150" y="30" width="150" height="240" rx="20" fill="#0F172A" stroke="#475569" stroke-width="3"/>
    <!-- Screen content -->
    <rect x="160" y="45" width="130" height="210" rx="10" fill="#F8FAFC"/>
    <circle cx="225" cy="110" r="30" fill="#DCFCE7"/>
    <path d="M212 110 L222 120 L238 102" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
    <text x="225" y="165" font-size="14" font-weight="800" fill="#111827" text-anchor="middle">PAYMENT</text>
    <rect x="180" y="185" width="90" height="24" rx="6" fill="#16A34A"/>
    <text x="225" y="201" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">결제 승인 완료</text>
  </g>

  <!-- Middle Right Star & Model Statement -->
  <g transform="translate(950, 310)">
    <g stroke="#9CA3AF" stroke-width="1.5" fill="none">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <line x1="-15" y1="-15" x2="15" y2="15"/>
      <line x1="-15" y1="15" x2="15" y2="-15"/>
    </g>
    <text x="40" y="-8" font-size="22" font-weight="600" fill="#374151">Trend24의 수익은 서비스별 용역비와</text>
    <text x="40" y="24" font-size="22" font-weight="600" fill="#374151">정기 구독료를 기반으로 구성됩니다.</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="120" y1="495" x2="1480" y2="495" stroke="#7E7C76" stroke-width="1.2"/>

  <!-- 3 Columns Bottom -->
  <g transform="translate(120, 555)">
    <text x="0" y="0" font-size="28" font-style="italic" font-weight="800" fill="#1E293B">01.</text>
    <text x="0" y="70" font-size="34" font-weight="800" fill="#111827">프로젝트형 용역</text>
    <text x="0" y="125" font-size="20" font-weight="500" fill="#374151">맞춤형 시장 조사 및 분석 프로젝트의</text>
    <text x="0" y="155" font-size="20" font-weight="500" fill="#374151">용역비 수익입니다.</text>
  </g>

  <g transform="translate(560, 555)">
    <text x="0" y="0" font-size="28" font-style="italic" font-weight="800" fill="#1E293B">02.</text>
    <text x="0" y="70" font-size="34" font-weight="800" fill="#111827">정기 구독 서비스</text>
    <text x="0" y="125" font-size="20" font-weight="500" fill="#374151">월간 또는 분기별 트렌드 리포트</text>
    <text x="0" y="155" font-size="20" font-weight="500" fill="#374151">구독료 수익입니다.</text>
  </g>

  <g transform="translate(1000, 555)">
    <text x="0" y="0" font-size="28" font-style="italic" font-weight="800" fill="#1E293B">03.</text>
    <text x="0" y="70" font-size="34" font-weight="800" fill="#111827">컨설팅 서비스</text>
    <text x="0" y="125" font-size="20" font-weight="500" fill="#374151">분석 결과를 바탕으로 전략 수립을 지원하고</text>
    <text x="0" y="155" font-size="20" font-weight="500" fill="#374151">컨설팅 수수료를 확보합니다.</text>
  </g>
</svg>
