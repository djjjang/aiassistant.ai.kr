<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#f8fafc; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- TOP HEADER -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  
  <!-- Logo / T24 badge -->
  <rect x="32" y="16" width="32" height="32" rx="8" fill="#2563eb" />
  <text x="48" y="37" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="-0.5">T24</text>
  
  <!-- Header Title -->
  <text x="76" y="32" fill="#111827" font-size="15" font-weight="700">AI 사내규정 챗봇</text>
  <text x="76" y="46" fill="#6b7280" font-size="11" font-weight="500">Internal Knowledge Bot · 트렌드24 업무대행</text>

  <!-- Status & Date -->
  <g transform="translate(976, 20)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#dcfce7" />
    <path d="M12 12l2.5 2.5 5-5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="16" fill="#15803d" font-size="11" font-weight="700">학습 완료 · 문서 4건</text>
    <text x="150" y="16" fill="#6b7280" font-size="12" font-weight="500">2026.09.23</text>
  </g>

  <!-- MAIN BODY -->
  <!-- LEFT COLUMN: 사내 규정 문서 (width: 260) -->
  <g transform="translate(32, 88)">
    <text x="0" y="18" fill="#111827" font-size="15" font-weight="800">사내 규정 문서</text>
    <rect x="224" y="4" width="36" height="20" rx="10" fill="#e0f2fe" />
    <text x="242" y="18" fill="#0284c7" font-size="11" font-weight="700" text-anchor="middle">4건</text>

    <!-- Document 1: 연차 · 휴가 규정 -->
    <g transform="translate(0, 32)">
      <rect width="260" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
      <!-- File Icon -->
      <path d="M16 15h9l5 5v13a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V17a2 2 0 0 1 2-2z" fill="none" stroke="#6b7280" stroke-width="1.5" />
      <path d="M25 15v5h5" fill="none" stroke="#6b7280" stroke-width="1.5" />
      <text x="38" y="27" fill="#374151" font-size="12" font-weight="600">연차 · 휴가 규정</text>
      <rect x="216" y="14" width="32" height="18" rx="4" fill="#f1f5f9" />
      <text x="232" y="27" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">PDF</text>
    </g>

    <!-- Document 2 (Selected): 경비처리 · 법인카드 규정 -->
    <g transform="translate(0, 86)">
      <rect width="260" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <!-- File Icon in Blue -->
      <path d="M16 15h9l5 5v13a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V17a2 2 0 0 1 2-2z" fill="none" stroke="#2563eb" stroke-width="1.5" />
      <path d="M25 15v5h5" fill="none" stroke="#2563eb" stroke-width="1.5" />
      <text x="38" y="27" fill="#1d4ed8" font-size="12" font-weight="700">경비처리 · 법인카드 규정</text>
      <rect x="216" y="14" width="32" height="18" rx="4" fill="#dbeafe" />
      <text x="232" y="27" fill="#2563eb" font-size="10" font-weight="700" text-anchor="middle">PDF</text>
    </g>

    <!-- Document 3: 재택 · 유연근무 규정 -->
    <g transform="translate(0, 140)">
      <rect width="260" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
      <path d="M16 15h9l5 5v13a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V17a2 2 0 0 1 2-2z" fill="none" stroke="#6b7280" stroke-width="1.5" />
      <path d="M25 15v5h5" fill="none" stroke="#6b7280" stroke-width="1.5" />
      <text x="38" y="27" fill="#374151" font-size="12" font-weight="600">재택 · 유연근무 규정</text>
      <rect x="216" y="14" width="32" height="18" rx="4" fill="#f1f5f9" />
      <text x="232" y="27" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">PDF</text>
    </g>

    <!-- Document 4: 보안 · 정보보호 수칙 -->
    <g transform="translate(0, 194)">
      <rect width="260" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
      <path d="M16 15h9l5 5v13a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V17a2 2 0 0 1 2-2z" fill="none" stroke="#6b7280" stroke-width="1.5" />
      <path d="M25 15v5h5" fill="none" stroke="#6b7280" stroke-width="1.5" />
      <text x="38" y="27" fill="#374151" font-size="12" font-weight="600">보안 · 정보보호 수칙</text>
      <rect x="216" y="14" width="32" height="18" rx="4" fill="#f1f5f9" />
      <text x="232" y="27" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">PDF</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: 챗봇 질의응답 미리보기 (width: 864) -->
  <g transform="translate(312, 88)">
    <text x="0" y="18" fill="#111827" font-size="15" font-weight="800">경비처리 및 법인카드 사용 규정</text>
    <rect x="214" y="4" width="94" height="20" rx="10" fill="#eff6ff" />
    <text x="261" y="18" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">질의응답 미리보기</text>

    <!-- Chat Box Window -->
    <g transform="translate(0, 32)" filter="url(#card-shadow)">
      <rect width="864" height="624" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />

      <!-- Bot Identity Header -->
      <g transform="translate(20, 16)">
        <circle cx="16" cy="16" r="15" fill="#2563eb" />
        <path d="M16 10v12M10 16h12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <text x="40" y="14" fill="#111827" font-size="14" font-weight="800">사내규정 도우미</text>
        <circle cx="43" cy="26" r="3.5" fill="#22c55e" />
        <text x="52" y="29" fill="#9ca3af" font-size="11" font-weight="500">전 직원 이용 가능</text>
      </g>
      <line x1="0" y1="62" x2="864" y2="62" stroke="#f3f4f6" stroke-width="1" />

      <!-- CONVERSATION -->
      <!-- Turn 1 -->
      <g transform="translate(24, 82)">
        <rect width="216" height="38" rx="12" fill="#f1f3f5" />
        <text x="14" y="24" fill="#1f2937" font-size="12.5" font-weight="500">법인카드로 팀 회식비 결제해도 되나요?</text>
        <text x="2" y="52" fill="#9ca3af" font-size="10.5">박준호 · 마케팅팀</text>
      </g>

      <g transform="translate(276, 148)">
        <rect width="564" height="60" rx="12" fill="#2563eb" />
        <text x="18" y="25" fill="#ffffff" font-size="12.5" font-weight="400">네, 가능합니다. 팀 회식비는 법인카드로 결제 후 3영업일 이내 경비시스템에 영수증을 첨부해 상신해주세요. 1인당 한</text>
        <text x="18" y="45" fill="#ffffff" font-size="12.5" font-weight="400">도는 5만원이며, 초과 시 팀장 승인이 필요해요.</text>
        <text x="562" y="74" fill="#64748b" font-size="10.5" text-anchor="end">출처 · 경비처리규정 3.2조</text>
      </g>

      <!-- Turn 2 -->
      <g transform="translate(24, 246)">
        <rect width="206" height="38" rx="12" fill="#f1f3f5" />
        <text x="14" y="24" fill="#1f2937" font-size="12.5" font-weight="500">영수증을 못 받았으면 어떻게 하나요?</text>
        <text x="2" y="52" fill="#9ca3af" font-size="10.5">박준호 · 마케팅팀</text>
      </g>

      <g transform="translate(276, 310)">
        <rect width="564" height="56" rx="12" fill="#2563eb" />
        <text x="18" y="24" fill="#ffffff" font-size="12.5" font-weight="400">영수증 분실 시 '지출결의서(영수증 미첨부)' 양식으로 대체 제출 가능합니다. 다만 10만원 이상 건은 사전 승인이 필요</text>
        <text x="18" y="44" fill="#ffffff" font-size="12.5" font-weight="400">해요.</text>
        <text x="562" y="70" fill="#64748b" font-size="10.5" text-anchor="end">출처 · 경비처리규정 4.1조</text>
      </g>

      <!-- Turn 3 -->
      <g transform="translate(24, 404)">
        <rect width="280" height="38" rx="12" fill="#f1f3f5" />
        <text x="14" y="24" fill="#1f2937" font-size="12.5" font-weight="500">해외 출장 중 사용한 카드 내역도 여기서 처리하나요?</text>
        <text x="2" y="52" fill="#9ca3af" font-size="10.5">박준호 · 마케팅팀</text>
      </g>

      <g transform="translate(276, 468)">
        <rect width="564" height="56" rx="12" fill="#2563eb" />
        <text x="18" y="24" fill="#ffffff" font-size="12.5" font-weight="400">해외 사용 건은 환율 적용 방식이 달라 '해외경비정산' 메뉴에서 별도 처리해주셔야 해요. 출장비 규정 문서도 함께 보</text>
        <text x="18" y="44" fill="#ffffff" font-size="12.5" font-weight="400">여드릴까요?</text>
        <text x="562" y="70" fill="#64748b" font-size="10.5" text-anchor="end">출처 · 경비처리규정 5.3조 · 출장비 규정 연계</text>
      </g>

      <!-- Bottom Chat Input -->
      <g transform="translate(0, 560)">
        <line x1="0" y1="0" x2="864" y2="0" stroke="#f3f4f6" stroke-width="1" />
        <rect x="20" y="10" width="772" height="42" rx="10" fill="#f1f3f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="36" y="36" fill="#9ca3af" font-size="13" font-weight="400">궁금한 사내 규정을 입력하세요</text>

        <!-- Send Button -->
        <circle cx="820" cy="31" r="18" fill="#2563eb" />
        <path d="M814 25l14 6-14 6 3-6-3-6zm3 6h7" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
