      <text x="27" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle">BEST 1</text>
      
      <!-- Graphic -->
