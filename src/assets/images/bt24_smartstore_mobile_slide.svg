    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#03c75a">BT24 STORE (iPad View)</text>
    
    <!-- 2 Column Responsive Tablet Layout Preview -->
