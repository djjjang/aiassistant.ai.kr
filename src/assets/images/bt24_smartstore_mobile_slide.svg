        <line x1="14" y1="14" x2="19" y2="19" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="42" y="0" width="24" height="20" rx="10" fill="#03c75a" fill-opacity="0.2" stroke="#03c75a" stroke-width="0.8"/>
