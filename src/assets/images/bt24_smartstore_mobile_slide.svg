      <rect width="100" height="140" rx="8" x="110" fill="#132130"/>
      <rect width="100" height="140" rx="8" y="152" fill="#132130"/>
      <rect width="100" height="140" rx="8" x="110" y="152" fill="#132130"/>
    </g>

    <!-- Floating Badge -->
