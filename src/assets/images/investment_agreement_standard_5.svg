      <!-- Row 1: 사업명(상호) -->
      <rect x="0" y="0" width="210" height="34" fill="#F8FAFC"/>
      <line x1="0" y1="34" x2="730" y2="34" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="105" y="22" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">사업명(상호)</text>
      <text x="225" y="22" font-size="12" font-weight="600" fill="#0F172A">(주)다온클럽 F&amp;B 직영점 및 프리미엄 카페 신규 출점 사업</text>

