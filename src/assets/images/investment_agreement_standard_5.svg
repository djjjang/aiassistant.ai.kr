      <line x1="220" y1="0" x2="220" y2="126" stroke="#CBD5E1" stroke-width="0.8"/>
      <line x1="375" y1="0" x2="375" y2="126" stroke="#CBD5E1" stroke-width="0.8"/>

      <!-- Header Row -->
