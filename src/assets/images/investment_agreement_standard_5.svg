      <text x="225" y="56" font-size="12" font-weight="500" fill="#334155">일반음식점업 / 스페셜티 커피 및 베이커리·디저트 프랜차이즈</text>

      <!-- Row 3: 사업 개시일 -->
      <rect x="0" y="68" width="210" height="34" fill="#F8FAFC"/>
      <line x1="0" y1="102" x2="730" y2="102" stroke="#E2E8F0" stroke-width="0.8"/>
