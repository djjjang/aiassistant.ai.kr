    <text x="14" y="2" font-size="17" font-weight="900" fill="#0F172A">[별지 1] 사업 개요 및 투자금 사용계획서</text>
    <text x="360" y="2" font-size="11.5" font-weight="600" fill="#64748B">(본 계약서 제2조 제2항, 제3조 제3항 및 제4조 제1항 연동)</text>
  </g>

  <!-- Section 1: 1. 사업 개요 -->
