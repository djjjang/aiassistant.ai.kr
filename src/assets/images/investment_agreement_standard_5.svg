  <!-- Section 3: 3. 투자금 납입 일정 -->
  <g transform="translate(60, 634)">
    <text x="0" y="0" font-size="13.5" font-weight="800" fill="#1E293B">3. 투자금 납입 일정 (분할 납입 명세표)</text>
    
    <!-- Table 3 -->
