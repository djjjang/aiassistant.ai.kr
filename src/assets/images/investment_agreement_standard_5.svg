  <!-- Section 2: 2. 투자금 사용계획 -->
  <g transform="translate(60, 362)">
    <text x="0" y="0" font-size="13.5" font-weight="800" fill="#1E293B">2. 투자금 상세 사용계획 (총액: 금 120,000,000원)</text>
    
    <!-- Table 2 -->
    <g transform="translate(0, 10)">
      <rect width="730" height="238" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

      <!-- Column Dividers -->
      <line x1="42" y1="0" x2="42" y2="238" stroke="#CBD5E1" stroke-width="0.8"/>
      <line x1="230" y1="0" x2="230" y2="238" stroke="#CBD5E1" stroke-width="0.8"/>
      <line x1="375" y1="0" x2="375" y2="238" stroke="#CBD5E1" stroke-width="0.8"/>

      <!-- Header Row -->
      <rect width="730" height="30" rx="4" fill="#F1F5F9"/>
      <line x1="0" y1="30" x2="730" y2="30" stroke="#CBD5E1" stroke-width="1"/>
      <text x="21" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">No</text>
      <text x="136" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">사용 항목</text>
      <text x="302" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">금액(원)</text>
      <text x="552" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">비고 (사용 시기 및 구체적 집행 내역)</text>

      <!-- Row 1 -->
      <line x1="0" y1="59" x2="730" y2="59" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="21" y="49" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">1</text>
      <text x="55" y="49" font-size="11.5" font-weight="700" fill="#1E293B">시설·인테리어</text>
      <text x="360" y="49" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">50,000,000</text>
      <text x="390" y="49" font-size="11" font-weight="400" fill="#334155">강남 2호점 실내 목공·조명·위생 배관 공사 및 감리비</text>

      <!-- Row 2 -->
      <line x1="0" y1="88" x2="730" y2="88" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="21" y="78" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">2</text>
      <text x="55" y="78" font-size="11.5" font-weight="700" fill="#1E293B">장비·집기</text>
