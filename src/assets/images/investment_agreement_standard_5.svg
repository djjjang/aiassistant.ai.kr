      <line x1="0" y1="30" x2="730" y2="30" stroke="#CBD5E1" stroke-width="1"/>
      <text x="27" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">회차</text>
      <text x="137" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">납입 기한</text>
      <text x="297" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">납입 금액(원)</text>
      <text x="552" y="20" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">연동 마일스톤 및 비고</text>

      <!-- Row 1 -->
      <line x1="0" y1="62" x2="730" y2="62" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="27" y="50" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">1회차</text>
      <text x="137" y="50" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="middle">계약 체결일 즉시</text>
      <text x="360" y="50" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">60,000,000</text>
      <text x="390" y="50" font-size="11" font-weight="500" fill="#334155">인테리어 착공 계약 및 주요 커피 머신 선금 (50%)</text>

      <!-- Row 2 -->
      <line x1="0" y1="94" x2="730" y2="94" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="27" y="82" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">2회차</text>
      <text x="137" y="82" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="middle">착공 20일 이내</text>
      <text x="360" y="82" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">40,000,000</text>
      <text x="390" y="82" font-size="11" font-weight="500" fill="#334155">인테리어 공정률 70% 현장 검수 및 기기 잔금 (33.3%)</text>

      <!-- Row 3 -->
      <text x="27" y="114" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">3회차</text>
      <text x="137" y="114" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="middle">영업 개시 5일 전</text>
      <text x="360" y="114" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">20,000,000</text>
      <text x="390" y="114" font-size="11" font-weight="500" fill="#334155">소방·위생 인허가 교부 및 초도 원재료 입고 확인 (16.7%)</text>
    </g>
  </g>

  <!-- Bottom Guidance & Verification Note Box -->
  <g transform="translate(60, 804)">
    <rect width="730" height="180" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <g transform="translate(18, 22)">
      <text x="0" y="0" font-size="12" font-weight="800" fill="#0F172A">※ [별지 1] 실무 검토 및 당사자 준수의무 확인</text>
      <text x="0" y="24" font-size="11.5" font-weight="400" fill="#475569" letter-spacing="-0.2">
        1. 투자금 전용 계좌 분리: 상기 지정 계좌는 사업자(을)의 기존 채무나 개인 자금과 엄격히 분리하여 독립 관리합니다.
      </text>
      <text x="0" y="44" font-size="11.5" font-weight="400" fill="#475569" letter-spacing="-0.2">
        2. 용도 외 사용 엄금: 제2호 명세 항목 간 10%를 초과하는 전용(예: 인테리어비 → 마케팅비)은 투자자(갑)의 서면 동의를 요합니다.
      </text>
      <text x="0" y="64" font-size="11.5" font-weight="400" fill="#475569" letter-spacing="-0.2">
        3. 분할 납입 연동 검수: 각 회차별 마일스톤 증빙(시공계약서, 기기 납품서, 인허가증 사본)을 갑에게 교부한 후 즉시 송금합니다.
      </text>
      <text x="0" y="86" font-size="11.5" font-weight="700" fill="#1D4ED8">
        ✓ 계약 효력: 본 [별지 1]은 사업 투자 계약서 본문과 일체가 되어 동일한 법적 구속력을 발생시킵니다.
      </text>
    </g>

    <!-- Signatures in Box -->
    <g transform="translate(20, 142)">
