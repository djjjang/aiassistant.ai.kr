      <text x="225" y="90" font-size="12" font-weight="600" fill="#1D4ED8">2026년 10월 15일 (영업 개시 예정일)</text>

      <!-- Row 4: 월 평균 매출 (최근 또는 예상) -->
      <rect x="0" y="102" width="210" height="34" fill="#F8FAFC"/>
      <line x1="0" y1="136" x2="730" y2="136" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="105" y="124" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">월 평균 매출 (예상)</text>
      <text x="225" y="124" font-size="12" font-weight="600" fill="#0F172A">금 52,000,000원 (상권분석 및 직영 1호점 실적 기반 추정)</text>

      <!-- Row 5: 기존 채무·담보 현황 -->
      <rect x="0" y="136" width="210" height="34" fill="#F8FAFC"/>
      <line x1="0" y1="170" x2="730" y2="170" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="105" y="158" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">기존 채무·담보 현황</text>
      <text x="225" y="158" font-size="12" font-weight="600" fill="#047857">■ 없음 (제1·2금융권 대출 및 대외 담보 일체 부존재 확약)</text>

      <!-- Row 6: 사업 계좌 (투자금 관리용) -->
      <rect x="0" y="170" width="210" height="34" fill="#F8FAFC"/>
      <text x="105" y="192" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">사업 계좌 (투자금 전용)</text>
      <text x="225" y="192" font-size="12" font-weight="600" fill="#0F172A">우리은행 1002-845-920141 (예금주: 주식회사 다온클럽)</text>
    </g>
