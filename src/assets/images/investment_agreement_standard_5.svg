      <text x="0" y="22" font-size="11.5" font-weight="700" fill="#334155">투자자(갑) 확인 날인: 김 성 진  (인)</text>
      <text x="360" y="22" font-size="11.5" font-weight="700" fill="#334155">사업자(을) 확약 날인: 주식회사 다온클럽 대표이사 이 다 온  (인)</text>
    </g>
  </g>

  <!-- Page Footer -->
  <line x1="60" y1="1130" x2="790" y2="1130" stroke="#CBD5E1" stroke-width="0.8"/>
  <g transform="translate(60, 1155)">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#94A3B8">트렌드 24 (T24 AI) 실무 표준 계약서 서식집</text>
