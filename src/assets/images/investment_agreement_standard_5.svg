      <text x="390" y="78" font-size="11" font-weight="400" fill="#334155">3그룹 에스프레소 머신, 그라인더 2대, POS 키오스크 2대</text>

      <!-- Row 3 -->
      <line x1="0" y1="117" x2="730" y2="117" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="21" y="107" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">3</text>
      <text x="55" y="107" font-size="11.5" font-weight="700" fill="#1E293B">초도 재고·원재료</text>
      <text x="360" y="107" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">15,000,000</text>
      <text x="390" y="107" font-size="11" font-weight="400" fill="#334155">스페셜티 원두 300kg, 베이커리 생지 및 패키지 용기</text>

      <!-- Row 4 -->
      <line x1="0" y1="146" x2="730" y2="146" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="21" y="136" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">4</text>
      <text x="55" y="136" font-size="11.5" font-weight="700" fill="#1E293B">마케팅·홍보</text>
      <text x="360" y="136" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">10,000,000</text>
      <text x="390" y="136" font-size="11" font-weight="400" fill="#334155">오픈 이벤트 인플루언서 섭외, 네이버 스마트플레이스 상위</text>

      <!-- Row 5 -->
      <line x1="0" y1="175" x2="730" y2="175" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="21" y="165" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">5</text>
      <text x="55" y="165" font-size="11.5" font-weight="700" fill="#1E293B">운영자금 (인건비·임차료)</text>
      <text x="360" y="165" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">10,000,000</text>
      <text x="390" y="165" font-size="11" font-weight="400" fill="#334155">오픈 초기 2개월 직원 급여 및 상가 관리비 예치금</text>

      <!-- Row 6 -->
      <line x1="0" y1="204" x2="730" y2="204" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="21" y="194" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">6</text>
      <text x="55" y="194" font-size="11.5" font-weight="700" fill="#1E293B">예비비</text>
      <text x="360" y="194" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="end">5,000,000</text>
      <text x="390" y="194" font-size="11" font-weight="400" fill="#334155">영업신고 인허가 수수료, 주방기기 긴급 A/S 대비금</text>

