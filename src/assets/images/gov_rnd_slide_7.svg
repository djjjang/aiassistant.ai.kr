<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0B1A2C"/>
  <rect x="35" y="35" width="1530" height="830" rx="14" fill="#0F243B" stroke="#1E446B" stroke-width="1.5"/>

  <!-- Top Header Navigation -->
  <g transform="translate(80, 75)">
    <rect width="110" height="32" rx="6" fill="#1D4ED8"/>
    <text x="55" y="21" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">6. 기대효과</text>
    <text x="130" y="22" font-size="22" font-weight="900" fill="#FFFFFF">연구개발 종료 후 기대효과 및 국가 산업적 파급성</text>
    <text x="1440" y="22" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="end">종합 발표 마무리 및 질의응답 (Q&amp;A)</text>
  </g>

  <!-- Big Vision Banner -->
  <g transform="translate(80, 135)">
    <rect width="1440" height="46" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="24" y="29" font-size="15" font-weight="800" fill="#38BDF8">국가 경제 기여도 :</text>
    <text x="160" y="29" font-size="15" font-weight="700" fill="#FFFFFF">
      외산 수입대체 380억 원 + 제조현장 산업재해 제로화(0%) + 청년 고급 R&amp;D 일자리 35명 창출
    </text>
  </g>

  <!-- 4 Impact Pillars Grid -->
  <g transform="translate(80, 205)">
    <!-- Pillar 1: 기술적 기대효과 -->
    <g transform="translate(0, 0)">
      <rect width="345" height="320" rx="12" fill="#0B1A2C" stroke="#254B73" stroke-width="1.2"/>
      <rect x="20" y="20" width="110" height="26" rx="4" fill="#1D4ED8"/>
      <text x="75" y="37" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">기술적 파급효과</text>
      
      <text x="20" y="80" font-size="20" font-weight="900" fill="#FFFFFF">핵심 SW 국산화율</text>
      <text x="20" y="105" font-size="16" font-weight="800" fill="#38BDF8">95% 원천 기술 자립</text>

      <line x1="20" y1="125" x2="325" y2="125" stroke="#1E446B" stroke-width="1"/>

      <text x="20" y="155" font-size="13" font-weight="700" fill="#FFFFFF">• 외산 종속 원천 탈피</text>
      <text x="20" y="177" font-size="12" font-weight="400" fill="#94A3B8">- 덴마크/독일 독점 자율주행 엔진 완전 대체</text>

      <text x="20" y="215" font-size="13" font-weight="700" fill="#FFFFFF">• 지능형 로보틱스 특허망</text>
      <text x="20" y="237" font-size="12" font-weight="400" fill="#94A3B8">- 도킹/군집관제 원천특허 4건으로 기술 장벽 구축</text>

      <text x="20" y="275" font-size="13" font-weight="700" fill="#FFFFFF">• 국가 스마트팩토리 표준화</text>
      <text x="20" y="297" font-size="12" font-weight="400" fill="#94A3B8">- K-스마트제조 표준 VDA 5050 국산 호환 가이드 제정</text>
    </g>

    <!-- Pillar 2: 경제적 기대효과 -->
    <g transform="translate(365, 0)">
      <rect width="345" height="320" rx="12" fill="#0B1A2C" stroke="#254B73" stroke-width="1.2"/>
      <rect x="20" y="20" width="110" height="26" rx="4" fill="#F05A22"/>
      <text x="75" y="37" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">경제적 파급효과</text>
      
      <text x="20" y="80" font-size="20" font-weight="900" fill="#FFFFFF">외산 수입 대체 효과</text>
      <text x="20" y="105" font-size="16" font-weight="800" fill="#F05A22">3개년 누적 380억 원</text>

      <line x1="20" y1="125" x2="325" y2="125" stroke="#1E446B" stroke-width="1"/>

      <text x="20" y="155" font-size="13" font-weight="700" fill="#FFFFFF">• 설비 도입 원가 55% 절감</text>
      <text x="20" y="177" font-size="12" font-weight="400" fill="#94A3B8">- 중소·중견 제조기업의 로봇 자동화 진입 장벽 혁신</text>

      <text x="20" y="215" font-size="13" font-weight="700" fill="#FFFFFF">• 3개년 누적 매출 297억 원</text>
      <text x="20" y="237" font-size="12" font-weight="400" fill="#94A3B8">- 2026년 24억 → 2027년 78억 → 2028년 195억 달성</text>

      <text x="20" y="275" font-size="13" font-weight="700" fill="#FFFFFF">• 글로벌 수출 88억 원 달성</text>
      <text x="20" y="297" font-size="12" font-weight="400" fill="#94A3B8">- 북미 배터리 라인 및 동남아 제조 클러스터 공급</text>
    </g>

    <!-- Pillar 3: 사회적 기대효과 -->
    <g transform="translate(730, 0)">
      <rect width="345" height="320" rx="12" fill="#0B1A2C" stroke="#254B73" stroke-width="1.2"/>
      <rect x="20" y="20" width="110" height="26" rx="4" fill="#10B981"/>
      <text x="75" y="37" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">사회적 파급효과</text>
      
      <text x="20" y="80" font-size="20" font-weight="900" fill="#FFFFFF">산업재해 위험 저감</text>
      <text x="20" y="105" font-size="16" font-weight="800" fill="#10B981">중대재해 Zero 실현</text>

      <line x1="20" y1="125" x2="325" y2="125" stroke="#1E446B" stroke-width="1"/>

      <text x="20" y="155" font-size="13" font-weight="700" fill="#FFFFFF">• 고위험 중량물 운반 무인화</text>
      <text x="20" y="177" font-size="12" font-weight="400" fill="#94A3B8">- 50kg 이상 중량물 이송 로봇 전담으로 근골격계 산재 90% 저감</text>

      <text x="20" y="215" font-size="13" font-weight="700" fill="#FFFFFF">• 제조 현장 근무 환경 개선</text>
      <text x="20" y="237" font-size="12" font-weight="400" fill="#94A3B8">- 단순 반복 노동자에서 스마트 로봇 관제 전문 인력으로 직무 전환</text>

      <text x="20" y="275" font-size="13" font-weight="700" fill="#FFFFFF">• ESG 친환경 녹색 제조</text>
      <text x="20" y="297" font-size="12" font-weight="400" fill="#94A3B8">- 고효율 회생제동 배터리 시스템 적용으로 탄소배출 25% 감축</text>
    </g>

    <!-- Pillar 4: 일자리 창출 -->
    <g transform="translate(1095, 0)">
      <rect width="345" height="320" rx="12" fill="#0B1A2C" stroke="#254B73" stroke-width="1.2"/>
      <rect x="20" y="20" width="110" height="26" rx="4" fill="#FBBF24"/>
      <text x="75" y="37" font-size="12" font-weight="800" fill="#1E293B" text-anchor="middle">일자리 창출</text>
      
      <text x="20" y="80" font-size="20" font-weight="900" fill="#FFFFFF">신규 청년 일자리</text>
      <text x="20" y="105" font-size="16" font-weight="800" fill="#FBBF24">누적 35명 정규직 채용</text>

      <line x1="20" y1="125" x2="325" y2="125" stroke="#1E446B" stroke-width="1"/>

      <text x="20" y="155" font-size="13" font-weight="700" fill="#FFFFFF">• 과제 기간 내 12명 채용 확약</text>
      <text x="20" y="177" font-size="12" font-weight="400" fill="#94A3B8">- AI 비전 엔지니어 4명, 임베디드 제어 4명, 기구설계 4명</text>

      <text x="20" y="215" font-size="13" font-weight="700" fill="#FFFFFF">• 지역 거점 대학 산학 연계</text>
      <text x="20" y="237" font-size="12" font-weight="400" fill="#94A3B8">- 청년 인턴십 및 채용 연계형 인재 육성 프로그램 운영</text>

      <text x="20" y="275" font-size="13" font-weight="700" fill="#FFFFFF">• 성과 공유제 및 우리사주제</text>
      <text x="20" y="297" font-size="12" font-weight="400" fill="#94A3B8">- 연구개발 인센티브 지급으로 장기 근속 및 기술 축적 보장</text>
    </g>
  </g>

  <!-- Final Presentation Wrap-up Card -->
  <g transform="translate(80, 550)">
    <rect width="1440" height="175" rx="12" fill="#162E4A" stroke="#2B5D8F" stroke-width="1.2"/>
    <text x="40" y="45" font-size="22" font-weight="900" fill="#FFFFFF">경청해 주셔서 감사합니다. 평가위원님들의 질의에 성실히 답변드리겠습니다.</text>
    <text x="40" y="80" font-size="14" font-weight="500" fill="#94A3B8">
      본 과제는 기술 개발에 그치지 않고, 대한민국 제조업의 경쟁력을 한 단계 도약시킬 국산 로봇 자율주행의 새로운 표준이 될 것입니다.
    </text>

    <!-- Right Side Contact / Representative Signature -->
    <g transform="translate(1000, 30)">
      <rect width="390" height="115" rx="8" fill="#0B1A2C" stroke="#254B73" stroke-width="1"/>
      <text x="20" y="32" font-size="12" font-weight="700" fill="#38BDF8">주관연구개발기관 공식 확인</text>
      <text x="20" y="62" font-size="16" font-weight="900" fill="#FFFFFF">주식회사 넥스트로보틱스</text>
      <text x="20" y="88" font-size="13" font-weight="600" fill="#94A3B8">대표이사 / 연구총괄책임자 <tspan fill="#FFFFFF" font-weight="700">강 태 훈</tspan> (인)</text>
      <text x="365" y="88" font-size="11" font-weight="600" fill="#10B981" text-anchor="end">직인 날인 완료</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 760)" font-size="13" fill="#94A3B8">
    <text x="0" y="0">발표 완료 : <tspan fill="#FFFFFF" font-weight="600">중소벤처기업부 기술개발지원사업 평가위원회 질의응답 (15분 Q&amp;A 진행)</tspan></text>
    <text x="1440" y="0" text-anchor="end" fill="#38BDF8" font-weight="700">SLIDE 07 / 07</text>
  </g>
</svg>
