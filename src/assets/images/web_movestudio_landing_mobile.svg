<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1820" width="420" height="1820" style="background:#fcfbf9; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="m-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#181514" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- MOBILE HEADER -->
  <rect x="0" y="0" width="420" height="60" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
  <text x="24" y="38" fill="#111827" font-size="16" font-weight="900" letter-spacing="1">MOVE STUDIO</text>
  <!-- Hamburger Menu Icon -->
  <g transform="translate(372, 24)" stroke="#111827" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="22" y2="0" />
    <line x1="0" y1="6" x2="22" y2="6" />
    <line x1="0" y1="12" x2="22" y2="12" />
  </g>

  <!-- HERO SECTION -->
  <g transform="translate(24, 84)">
    <!-- Badge -->
    <rect x="135" y="0" width="102" height="24" rx="12" fill="#faebe5" />
    <text x="186" y="16" fill="#c25737" font-size="11" font-weight="700" text-anchor="middle">강남점 신규 OPEN</text>

    <!-- Main Title -->
    <text x="186" y="52" fill="#111827" font-size="23" font-weight="900" text-anchor="middle" letter-spacing="-0.3">몸이 편해지는 필라테스,</text>
    <text x="186" y="82" fill="#111827" font-size="23" font-weight="900" text-anchor="middle" letter-spacing="-0.3">무브스튜디오에서 시작하세요</text>

    <!-- Subtitle -->
    <text x="186" y="118" fill="#6b7280" font-size="12" font-weight="500" text-anchor="middle">최대 6인 소그룹, 강사가 자세 하나하나</text>
    <text x="186" y="136" fill="#6b7280" font-size="12" font-weight="500" text-anchor="middle">봐주는 맞춤형 필라테스 · 그룹핏</text>

    <!-- Graphic -->
    <g transform="translate(186, 230)">
      <circle cx="10" cy="-10" r="80" fill="#fed7aa" opacity="0.65" />
      <circle cx="50" cy="-35" r="55" fill="#fca5a5" opacity="0.75" />
      <circle cx="-50" cy="15" r="42" fill="#78a57e" opacity="0.85" />

      <!-- Figure -->
      <g transform="translate(0, -60)" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="0" cy="10" r="8" fill="#ffffff" stroke="none" />
        <line x1="0" y1="20" x2="0" y2="52" />
        <line x1="0" y1="30" x2="-24" y2="20" />
        <line x1="0" y1="30" x2="24" y2="20" />
        <line x1="0" y1="52" x2="-20" y2="82" />
        <line x1="0" y1="52" x2="20" y2="82" />
      </g>
    </g>

    <!-- Buttons -->
    <g transform="translate(0, 340)">
      <rect width="372" height="46" rx="23" fill="#c25737" />
      <text x="186" y="29" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">체험수업 예약하기</text>

      <rect y="58" width="372" height="46" rx="23" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
      <text x="186" y="87" fill="#374151" font-size="14" font-weight="600" text-anchor="middle">클래스 둘러보기</text>
    </g>
  </g>

  <!-- STATS STACK -->
  <g transform="translate(24, 550)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#m-shadow)">
      <rect width="372" height="58" rx="10" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <text x="24" y="34" fill="#6b7280" font-size="12" font-weight="500">누적 수강생</text>
      <text x="348" y="36" fill="#b84e31" font-size="19" font-weight="900" text-anchor="end">1,200+</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(0, 68)" filter="url(#m-shadow)">
      <rect width="372" height="58" rx="10" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <text x="24" y="34" fill="#6b7280" font-size="12" font-weight="500">평균 수업 만족도</text>
      <text x="348" y="36" fill="#b84e31" font-size="19" font-weight="900" text-anchor="end">4.9 / 5</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 136)" filter="url(#m-shadow)">
      <rect width="372" height="58" rx="10" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <text x="24" y="34" fill="#6b7280" font-size="12" font-weight="500">전 강사 자격 인증시간</text>
      <text x="348" y="36" fill="#b84e31" font-size="19" font-weight="900" text-anchor="end">500h+</text>
    </g>
  </g>

  <!-- FEATURES SECTION -->
  <g transform="translate(24, 780)">
    <text x="186" y="0" fill="#111827" font-size="20" font-weight="900" text-anchor="middle">왜 무브스튜디오인가요</text>

    <!-- Feature 1 -->
    <g transform="translate(0, 30)" filter="url(#m-shadow)">
      <rect width="372" height="130" rx="14" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <rect x="20" y="18" width="36" height="36" rx="8" fill="#ffedd5" />
      <g transform="translate(30, 28)" stroke="#c25737" stroke-width="1.8" fill="none">
        <circle cx="5" cy="4" r="2.5" />
        <path d="M1 13v-1.5a3 3 0 0 1 6 0v1.5" />
        <circle cx="12" cy="5" r="2" />
        <path d="M10 13v-1a2.5 2.5 0 0 1 5 0v1" />
      </g>
      <text x="20" y="78" fill="#111827" font-size="14.5" font-weight="800">최대 6인 소그룹 케어</text>
      <text x="20" y="104" fill="#64748b" font-size="11.5">인원이 적어서 강사님이 자세 하나하나 직접 봐드려요.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0, 172)" filter="url(#m-shadow)">
      <rect width="372" height="130" rx="14" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <rect x="20" y="18" width="36" height="36" rx="8" fill="#ffedd5" />
      <g transform="translate(32, 27)" stroke="#c25737" stroke-width="1.8" fill="none">
        <rect x="0" y="0" width="13" height="17" rx="2" />
        <line x1="3" y1="5" x2="10" y2="5" />
        <line x1="3" y1="9" x2="10" y2="9" />
      </g>
      <text x="20" y="78" fill="#111827" font-size="14.5" font-weight="800">초보자 맞춤 커리큘럼</text>
      <text x="20" y="100" fill="#64748b" font-size="11.5">처음이어도 괜찮아요. 레벨별 클래스로 차근차근 따라</text>
      <text x="20" y="116" fill="#64748b" font-size="11.5">올 수 있어요.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 314)" filter="url(#m-shadow)">
      <rect width="372" height="130" rx="14" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <rect x="20" y="18" width="36" height="36" rx="8" fill="#ffedd5" />
      <g transform="translate(34, 28)" stroke="#c25737" stroke-width="1.8" fill="none">
        <rect x="0" y="0" width="11" height="17" rx="2" />
        <circle cx="5.5" cy="13" r="0.6" fill="#c25737" />
      </g>
      <text x="20" y="78" fill="#111827" font-size="14.5" font-weight="800">앱으로 간편 예약</text>
      <text x="20" y="104" fill="#64748b" font-size="11.5">예약, 변경, 취소까지 앱에서 몇 초면 끝나요.</text>
    </g>
  </g>

  <!-- PROMO BANNER -->
  <g transform="translate(24, 1260)">
    <rect width="372" height="150" rx="16" fill="#c25737" />
    <text x="20" y="32" fill="#fed7aa" font-size="11" font-weight="600">신규 오픈 기념 혜택 · 10월 31일까지</text>
    <text x="20" y="60" fill="#ffffff" font-size="16" font-weight="900">체험 수업 1회 무료 + 3개월 등록 시</text>
    <text x="20" y="82" fill="#ffffff" font-size="16" font-weight="900">15% 할인</text>

    <g transform="translate(20, 96)">
      <rect width="332" height="38" rx="19" fill="#ffffff" />
      <text x="166" y="24" fill="#c25737" font-size="13" font-weight="800" text-anchor="middle">혜택 받기</text>
    </g>
  </g>

  <!-- REVIEWS -->
  <g transform="translate(24, 1440)">
    <text x="186" y="0" fill="#111827" font-size="19" font-weight="900" text-anchor="middle">먼저 경험한 회원들의 이야기</text>

    <!-- Review 1 -->
    <g transform="translate(0, 24)" filter="url(#m-shadow)">
      <rect width="372" height="114" rx="12" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <text x="18" y="24" fill="#c25737" font-size="12">★★★★★</text>
      <text x="18" y="46" fill="#1f2937" font-size="11.5" font-weight="500">"인원이 적으니까 자세 교정을 매번 받을 수 있어서</text>
      <text x="18" y="64" fill="#1f2937" font-size="11.5" font-weight="500">좋아요. 허리 통증이 확실히 줄었습니다."</text>
      <text x="18" y="94" fill="#64748b" font-size="10.5">수강생 J님 · 3개월 수강</text>
    </g>

    <!-- Review 2 -->
    <g transform="translate(0, 150)" filter="url(#m-shadow)">
      <rect width="372" height="114" rx="12" fill="#ffffff" stroke="#f0eee9" stroke-width="1" />
      <text x="18" y="24" fill="#c25737" font-size="12">★★★★★</text>
      <text x="18" y="46" fill="#1f2937" font-size="11.5" font-weight="500">"운동 처음인데도 전혀 부담 없었어요. 앱 예약도 편</text>
      <text x="18" y="64" fill="#1f2937" font-size="11.5" font-weight="500">하고 시간 맞추기 좋아서 꾸준히 다니게 돼요."</text>
      <text x="18" y="94" fill="#64748b" font-size="10.5">수강생 M님 · 6개월 수강</text>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(0, 1720)">
    <rect width="420" height="100" fill="#181514" />
    <text x="210" y="32" fill="#ffffff" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">MOVE STUDIO</text>
    <text x="210" y="52" fill="#9ca3af" font-size="10" text-anchor="middle">강남점 · 평일 07:00~22:00 · 주말 09:00~18:00</text>
    <text x="210" y="68" fill="#9ca3af" font-size="10" text-anchor="middle">문의 02-0000-0000</text>
  </g>
</svg>
