<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      text {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="#FFFFFF"/>

  <!-- Top Badge (1 / 7) -->
  <rect x="70" y="70" width="56" height="26" rx="13" fill="#E8F5E9"/>
  <text x="98" y="87" text-anchor="middle" fill="#2E7D32" font-size="12" font-weight="700">1 / 7</text>

  <!-- Top Right Section Label -->
  <text x="730" y="87" text-anchor="end" fill="#6B7280" font-size="14" font-weight="600">사업개요</text>

  <!-- Center Content Area -->
  <!-- Subtitle -->
  <text x="400" y="320" text-anchor="middle" fill="#6B7280" font-size="14" font-weight="600">2026년도 TIPS 프로그램 지원사업 사업계획서</text>

  <!-- Circle Icon Container -->
  <circle cx="400" cy="390" r="48" fill="#D7F3E3"/>

  <!-- Recycling / Circular Arrows Icon inside circle -->
  <g transform="translate(376, 366)" fill="none" stroke="#1B8748" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 16a9 9 0 0 1 14.5 -5.5l2.5 2.5"/>
    <path d="M24 8v5h-5"/>
    <path d="M41 32a9 9 0 0 1 -14.5 5.5l-2.5 -2.5"/>
    <path d="M24 40v-5h5"/>
  </g>

  <!-- Brand Title -->
  <text x="400" y="475" text-anchor="middle" fill="#111827" font-size="24" font-weight="800" letter-spacing="-0.5">오일루프</text>
  <text x="400" y="498" text-anchor="middle" fill="#1B8748" font-size="13" font-weight="800" letter-spacing="2">OILLOOP</text>

  <!-- Main Proposal Title -->
  <text x="400" y="585" text-anchor="middle" fill="#111827" font-size="34" font-weight="800" letter-spacing="-0.8">AI 기반 폐식용유</text>
  <text x="400" y="632" text-anchor="middle" fill="#111827" font-size="34" font-weight="800" letter-spacing="-0.8">수거 매칭 플랫폼</text>

  <!-- Sub-description -->
  <text x="400" y="688" text-anchor="middle" fill="#4B5563" font-size="15" font-weight="400">배출처와 수거업체를 실시간으로 연결하는</text>
  <text x="400" y="715" text-anchor="middle" fill="#4B5563" font-size="15" font-weight="400">스마트 폐자원 유통 네트워크</text>

  <!-- Bottom Divider Line -->
  <line x1="70" y1="920" x2="730" y2="920" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Bottom Left Info -->
  <text x="70" y="960" font-size="14">
    <tspan fill="#111827" font-weight="700">신청기업 </tspan>
    <tspan fill="#374151" font-weight="400"> (주)오일루프</tspan>
  </text>
  <text x="70" y="988" font-size="14">
    <tspan fill="#111827" font-weight="700">제출일 </tspan>
    <tspan fill="#374151" font-weight="400"> 2026. 09.</tspan>
  </text>

  <!-- Bottom Right Attribution -->
  <text x="730" y="1030" text-anchor="end" fill="#9CA3AF" font-size="12" font-weight="500">AI 사업계획서 작성 · 트렌드24 업무대행</text>
</svg>
