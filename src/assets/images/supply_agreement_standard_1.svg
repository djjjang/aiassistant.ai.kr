<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1200" width="850" height="1200">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    </style>
  </defs>

  <rect width="850" height="1200" fill="#FFFFFF"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="850" height="52" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(60, 32)">
    <rect x="0" y="-18" width="80" height="24" rx="4" fill="#0F172A"/>
    <text x="40" y="-2" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">T24 LEGAL</text>
    <text x="94" y="-1" font-size="12" font-weight="700" fill="#334155">B2B 물품 납품 및 자재 공급 기본계약서</text>
    <text x="325" y="-1" font-size="11" font-weight="500" fill="#64748B">| 표준 관리서식</text>
  </g>
  <g transform="translate(790, 32)" text-anchor="end">
    <text x="0" y="-1" font-size="11" font-weight="600" fill="#64748B">문서번호: T24-SP-2026-0921</text>
  </g>

  <!-- Document Title Section -->
  <g transform="translate(425, 100)" text-anchor="middle">
    <text x="0" y="0" font-size="24" font-weight="900" fill="#0F172A" letter-spacing="-0.5">물품 납품 및 자재 공급 계약서</text>
    <rect x="-170" y="14" width="340" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
    <text x="0" y="29" font-size="11" font-weight="700" fill="#1D4ED8">【 표준 기본계약서 · 분쟁 예방 및 공정거래 가이드 완비 】</text>
  </g>

  <!-- Preamble Section -->
  <g transform="translate(60, 160)">
    <rect width="730" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="24" font-size="12.5" font-weight="500" fill="#1E293B" letter-spacing="-0.2">
      주식회사 한국글로벌제조(이하 "갑"이라 한다)와 주식회사 케이원인더스트리(이하 "을"이라 한다)는 갑이 영위하는
    </text>
    <text x="20" y="44" font-size="12.5" font-weight="500" fill="#1E293B" letter-spacing="-0.2">
      사업과 관련하여 물품 및 자재의 공급 거래에 관한 기본적인 권리와 의무를 규정하기 위해 본 계약을 체결한다.
    </text>
  </g>

  <!-- Article 1: 제 1 조 (목적) -->
  <g transform="translate(60, 240)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 1 조 (목적)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      본 계약은 갑이 을로부터 공급받는 물품 및 부품·자재(이하 "물품"이라 한다)의 개별 발주, 납품, 검수, 대금 지급 및
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      품질보증에 관한 기본적 사항과 갑과 을 상호 간의 성실한 계약 이행 의무를 정함을 목적으로 한다.
    </text>
  </g>

  <!-- Article 2: 제 2 조 (공급 물품 및 계약금액) -->
  <g transform="translate(60, 325)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 2 조 (공급 물품 및 계약금액)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 을이 공급하는 물품의 품목, 규격, 수량, 단가 및 금액은 본 계약 [별표 1] 「공급물품 명세서」에서 정한 바에 따른다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 총 계약금액은 금 사억이천구백만 원정(₩429,000,000, 부가가치세 포함)으로 하며, 부가가치세는 별도로 표기한다.
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 계약금액에는 포장비, 적재비 및 제5조에 따른 갑의 지정 납품장소까지의 운송비 일체가 포함된 것으로 본다.
    </text>
  </g>

  <!-- Article 3: 제 3 조 (계약기간 및 갱신) -->
  <g transform="translate(60, 430)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 3 조 (계약기간 및 갱신)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 본 계약의 유효기간은 2026년 10월 01일부터 2027년 09월 30일까지(1년간)로 한다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 계약기간 만료 30일 전까지 어느 일방 당사자도 상대방에게 서면으로 해지 또는 조건 변경 의사를 통지하지 않는 경우,
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      본 계약은 동일한 조건으로 1년간 자동 연장되며, 그 후에도 이와 같다.
    </text>
  </g>

  <!-- Article 4: 제 4 조 (개별 발주 및 승낙) -->
  <g transform="translate(60, 535)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 4 조 (개별 발주 및 승낙)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 갑은 품목, 규격, 수량, 납기, 납품장소 등을 구체적으로 명시한 발주서(전자문서 포함)를 을에게 교부하여 개별 발주한다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 을은 발주서를 수령한 날부터 2영업일 이내에 수락 여부를 서면 또는 전자로 통지하여야 하며, 해당 기간 내에 별도의
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      이의를 제기하지 아니한 때에는 개별 발주를 정식 수락한 것으로 본다.
    </text>
    <text x="14" y="82" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 개별 발주의 내용이 본 계약과 상충할 경우 본 계약이 우선하며, 별도의 서면 합의가 있는 경우에만 그에 따른다.
    </text>
  </g>

  <!-- Article 5: 제 5 조 (납품 및 운송) -->
  <g transform="translate(60, 655)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 5 조 (납품 및 운송)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 을은 개별 발주서에서 지정한 납기일까지 갑이 지정한 납품장소(갑의 사업소 또는 물류창고)에 물품을 안전하게 납품한다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 을은 납품 시 거래명세표 2부, 공인 품질검사성적서(KOLAS 인증) 및 갑이 요구한 검수 서류를 동봉하여 제출한다.
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 을은 납기 내 납품이 곤란할 사유가 발생한 때에는 지체 없이 그 사유와 예상 납품일을 통지하고 갑과 협의하여야 한다.
    </text>
  </g>

  <!-- Article 6: 제 6 조 (검수 및 합격 간주) -->
  <g transform="translate(60, 760)">
    <rect x="0" y="-14" width="6" height="18" fill="#2563EB" rx="1"/>
    <text x="14" y="0" font-size="14.5" font-weight="800" fill="#0F172A">제 6 조 (검수 및 합격 간주)</text>
    <text x="14" y="22" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ① 갑은 물품을 수령한 날부터 7영업일 이내에 [별표 1]의 검수 기준에 따라 검수를 완료하고 결과를 서면 통지하여야 한다.
    </text>
    <text x="14" y="42" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ② 갑이 제1항의 기간 내에 을에게 서면으로 검수 불합격 통지를 하지 아니한 때에는 해당 물품은 검수에 합격한 것으로 본다.
    </text>
    <text x="14" y="62" font-size="12.5" font-weight="400" fill="#334155" letter-spacing="-0.2">
      ③ 검수 불합격 시 을은 통지 수령일부터 7일 이내에 자기 비용으로 신품 교환, 하자 보완 또는 재납품을 이행하여야 한다.
    </text>
  </g>

  <!-- T24 Legal Commentary Box -->
  <g transform="translate(60, 875)">
    <rect width="730" height="195" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <rect x="18" y="16" width="130" height="22" rx="4" fill="#16A34A"/>
    <text x="83" y="31" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">T24 핵심 검토 가이드</text>
    <text x="160" y="32" font-size="13" font-weight="800" fill="#14532D">검수 합격 간주 규정(제6조 제2항)의 공급사 보호 실무 효력</text>
    
    <line x1="18" y1="48" x2="712" y2="48" stroke="#BBF7D0" stroke-width="1"/>
    
    <text x="20" y="70" font-size="12" font-weight="700" fill="#166534">• [실무 쟁점] 구매처(갑)의 고의적 검수 지연으로 인한 대금 청구 불능 방지</text>
    <text x="20" y="90" font-size="11.5" font-weight="400" fill="#14532D" letter-spacing="-0.2">
      일반적인 계약에서는 갑이 검수 완료 통지를 차일피일 미뤄 을의 세금계산서 발행과 대금 청구가 수개월씩 지연되는
    </text>
    <text x="20" y="108" font-size="11.5" font-weight="400" fill="#14532D" letter-spacing="-0.2">
      악성 관행이 빈번합니다. 이에 본 표준 계약서는 "물품 수령 후 7일 이내 서면 이의가 없으면 합격으로 간주"하는
    </text>
    <text x="20" y="126" font-size="11.5" font-weight="400" fill="#14532D" letter-spacing="-0.2">
      확정 기한제를 도입하여 을이 기한 도과 즉시 정당하게 대금을 청구할 수 있도록 안전장치를 마련했습니다.
    </text>
    
    <rect x="20" y="142" width="690" height="38" rx="4" fill="#DCFCE7"/>
    <text x="32" y="165" font-size="11.5" font-weight="700" fill="#15803D">
      ✓ 표준 권고: 불합격 통지 방식은 반드시 '구체적 사유가 적시된 서면'으로 한정하여 구두 거절 리스크를 원천 차단함.
    </text>
  </g>

  <!-- Page Footer -->
  <line x1="60" y1="1120" x2="790" y2="1120" stroke="#CBD5E1" stroke-width="0.8"/>
  <g transform="translate(60, 1145)">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#94A3B8">트렌드 24 (T24 AI) 실무 표준 계약서 서식집</text>
  </g>
  <g transform="translate(425, 1145)" text-anchor="middle">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#334155">- 1 / 5 -</text>
  </g>
  <g transform="translate(790, 1145)" text-anchor="end">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#94A3B8">(주)한국글로벌제조 ✕ (주)케이원인더스트리</text>
  </g>
</svg>
