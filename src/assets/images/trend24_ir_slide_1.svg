<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }</style></defs><rect width="1600" height="900" fill="#0F2439"/><rect x="40" y="40" width="1520" height="820" rx="16" fill="#162E4A" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 100)">  <rect width="150" height="36" rx="6" fill="#F05A22"/>  <text x="75" y="23" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TREND24 AI</text>  <rect x="170" y="0" width="180" height="36" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>  <text x="260" y="23" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">SERIES A IR PITCH DECK</text>  <text x="1360" y="24" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="end">Fashion · Material · Textile · Coordination</text></g><g transform="translate(100, 240)">  <text x="0" y="0" font-size="20" font-weight="700" fill="#38BDF8" letter-spacing="2">글로벌 패션 비즈니스를 혁신하는 AI 트렌드 인텔리전스</text>  <text x="0" y="100" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Trend24 투자 제안서</text>  <text x="0" y="160" font-size="24" font-weight="500" fill="#CBD5E1">빅데이터 예측 알고리즘 기반 B2B 엔터프라이즈 패션 테크 솔루션</text></g><line x1="100" y1="460" x2="1500" y2="460" stroke="#2D4F7C" stroke-width="1.5"/><g transform="translate(100, 510)">  <g transform="translate(0, 0)">    <rect width="325" height="160" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <text x="24" y="42" font-size="13" font-weight="600" fill="#94A3B8">목표 투자 유치액</text>    <text x="24" y="88" font-size="36" font-weight="900" fill="#F05A22">30억 원</text>    <text x="24" y="125" font-size="13" font-weight="500" fill="#64748B">Series A Round (₩3,000,000,000)</text>  </g>  <g transform="translate(355, 0)">    <rect width="325" height="160" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <text x="24" y="42" font-size="13" font-weight="600" fill="#94A3B8">투자 전 기업 가치 (Pre-money)</text>    <text x="24" y="88" font-size="36" font-weight="900" fill="#38BDF8">150억 원</text>    <text x="24" y="125" font-size="13" font-weight="500" fill="#64748B">투자 후 180억 원 (Post-money)</text>  </g>  <g transform="translate(710, 0)">    <rect width="325" height="160" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <text x="24" y="42" font-size="13" font-weight="600" fill="#94A3B8">유료 고객사 및 매출 성장</text>    <text x="24" y="88" font-size="36" font-weight="900" fill="#10B981">320개 사</text>    <text x="24" y="125" font-size="13" font-weight="500" fill="#64748B">ARR 24억 원 달성 (YoY +280%)</text>  </g>  <g transform="translate(1065, 0)">    <rect width="325" height="160" rx="12" fill="#0F2439" stroke="#334155" stroke-width="1.2"/>    <text x="24" y="42" font-size="13" font-weight="600" fill="#94A3B8">2029년 목표 기업 가치</text>    <text x="24" y="88" font-size="36" font-weight="900" fill="#FBBF24">3,000억 원</text>    <text x="24" y="125" font-size="13" font-weight="500" fill="#64748B">KOSDAQ 기술특례 상장(IPO)</text>  </g></g><g transform="translate(100, 735)" font-size="13" fill="#94A3B8">  <text x="0" y="0">제출처 : <tspan fill="#FFFFFF" font-weight="600">국내외 주요 벤처캐피탈(VC), 신기술금융사 및 전략적 투자자(SI)</tspan></text>  <text x="750" y="0">발행일 : <tspan fill="#FFFFFF" font-weight="600">2026년 9월</tspan></text>  <text x="1360" y="0" text-anchor="end">주식회사 트렌드24 IR 총괄팀</text></g></svg>