<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" style="background:#f8fafc; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="studio-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <linearGradient id="beauty-hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="glow-device" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- TOP HEADER -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <rect x="32" y="16" width="32" height="32" rx="8" fill="#2563eb" />
  <text x="48" y="37" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="-0.5">T24</text>
  <text x="76" y="32" fill="#111827" font-size="15" font-weight="700">AI 상품 상세페이지 기획·디자인</text>
  <text x="76" y="46" fill="#6b7280" font-size="11" font-weight="500">Product Detail Page Studio · 트렌드24 업무대행</text>

  <!-- Status & Date -->
  <g transform="translate(980, 20)">
    <rect width="134" height="24" rx="12" fill="#dcfce7" />
    <path d="M12 12l2.5 2.5 5-5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="16" fill="#15803d" font-size="11" font-weight="700">기획·디자인 완료</text>
    <text x="146" y="16" fill="#6b7280" font-size="12" font-weight="500">2026.09.23</text>
  </g>

  <!-- MAIN BODY -->
  <!-- LEFT COLUMN: PLANNING CONSOLE (width: 440) -->
  <!-- Card 1: 기획 개요 -->
  <g transform="translate(32, 88)" filter="url(#studio-shadow)">
    <rect width="440" height="196" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="24" y="36" fill="#2563eb" font-size="14" font-weight="800">기획 개요</text>

    <g transform="translate(24, 62)" font-size="13">
      <!-- Row 1 -->
      <text x="0" y="0" fill="#6b7280" font-weight="500">브랜드</text>
      <text x="80" y="0" fill="#111827" font-weight="700">글로우빔(GlowBeam)</text>

      <!-- Row 2 -->
      <text x="0" y="32" fill="#6b7280" font-weight="500">제품</text>
      <text x="80" y="32" fill="#111827" font-weight="700">LED 스킨케어 미니 디바이스</text>

      <!-- Row 3 -->
      <text x="0" y="64" fill="#6b7280" font-weight="500">타겟</text>
      <text x="80" y="64" fill="#111827" font-weight="700">30~40대 홈케어 관심 여성</text>

      <!-- Row 4 -->
      <text x="0" y="96" fill="#6b7280" font-weight="500">채널</text>
      <text x="80" y="96" fill="#111827" font-weight="700">자사몰 · 스마트스토어</text>
    </g>
  </g>

  <!-- Card 2: AI 추천 구성 (7단계) -->
  <g transform="translate(32, 300)" filter="url(#studio-shadow)">
    <rect width="440" height="490" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="24" y="34" fill="#2563eb" font-size="14" font-weight="800">AI 추천 구성 (7단계)</text>

    <!-- Steps -->
    <g transform="translate(24, 52)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="14" r="11" fill="#2563eb" />
        <text x="12" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="34" y="12" fill="#111827" font-size="13" font-weight="700">후킹 헤드카피 + 핵심 소구 3가지</text>
        <text x="34" y="28" fill="#6b7280" font-size="11" font-weight="400">첫 스크롤 3초 이탈 방지 문구</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 52)">
        <circle cx="12" cy="14" r="11" fill="#2563eb" />
        <text x="12" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="34" y="12" fill="#111827" font-size="13" font-weight="700">제품 이미지 갤러리 구성</text>
        <text x="34" y="28" fill="#6b7280" font-size="11" font-weight="400">정면 · 사용컷 · 디테일 · 패키지</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 104)">
        <circle cx="12" cy="14" r="11" fill="#2563eb" />
        <text x="12" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3</text>
        <text x="34" y="12" fill="#111827" font-size="13" font-weight="700">핵심 기능 아이콘 4종</text>
        <text x="34" y="28" fill="#6b7280" font-size="11" font-weight="400">저자극 · 무선충전 · 강도조절 · A/S</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 156)">
        <circle cx="12" cy="14" r="11" fill="#2563eb" />
        <text x="12" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">4</text>
        <text x="34" y="12" fill="#111827" font-size="13" font-weight="700">Before / After 사용 비주얼</text>
        <text x="34" y="28" fill="#6b7280" font-size="11" font-weight="400">2주 사용 변화 비교 구간</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 208)">
        <circle cx="12" cy="14" r="11" fill="#94a3b8" />
        <text x="12" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">5</text>
        <text x="34" y="12" fill="#111827" font-size="13" font-weight="700">성분 · 스펙 표</text>
        <text x="34" y="28" fill="#94a3b8" font-size="11" font-weight="400">KC인증 / 배터리용량 / 무게(85g)</text>
      </g>

      <!-- Step 6 -->
      <g transform="translate(0, 260)">
        <circle cx="12" cy="14" r="11" fill="#94a3b8" />
        <text x="12" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">6</text>
        <text x="34" y="12" fill="#111827" font-size="13" font-weight="700">자주 묻는 질문 (FAQ)</text>
        <text x="34" y="28" fill="#94a3b8" font-size="11" font-weight="400">충전 주기, 방수 여부, 민감성 피부 사용법</text>
      </g>

      <!-- Step 7 -->
      <g transform="translate(0, 312)">
        <circle cx="12" cy="14" r="11" fill="#94a3b8" />
        <text x="12" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">7</text>
        <text x="34" y="12" fill="#111827" font-size="13" font-weight="700">구매 혜택 및 안심 보증 안내</text>
        <text x="34" y="28" fill="#94a3b8" font-size="11" font-weight="400">무료배송 + 1년 무상 A/S + 전용 파우치 증정</text>
      </g>

      <!-- Bottom Tip -->
      <g transform="translate(0, 372)">
        <rect width="392" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="14" y="26" fill="#0369a1" font-size="11.5" font-weight="600">💡 스마트스토어/자사몰 모바일 가독성 최적화 완료 (세로폭 860px)</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: PREVIEW PANEL (width: 680) -->
  <g transform="translate(496, 88)">
    <text x="0" y="18" fill="#374151" font-size="14" font-weight="800">미리보기 · Preview</text>

    <!-- Detail Page Mobile Container -->
    <g transform="translate(0, 32)" filter="url(#studio-shadow)">
      <rect width="672" height="670" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

      <!-- Hero Visual Banner (Top half) -->
      <g clip-path="url(#hero-clip)">
        <clipPath id="hero-clip">
          <rect width="672" height="260" rx="20" />
        </clipPath>
        <rect width="672" height="260" fill="url(#beauty-hero-grad)" />

        <!-- Soft Aura Rings -->
        <circle cx="480" cy="130" r="140" fill="#fed7aa" opacity="0.4" />
        <circle cx="520" cy="90" r="90" fill="#f43f5e" opacity="0.15" />
        <circle cx="200" cy="180" r="110" fill="#38bdf8" opacity="0.2" />

        <!-- Best Seller Badge -->
        <g transform="translate(28, 24)">
          <rect width="76" height="26" rx="13" fill="#ffedd5" />
          <text x="38" y="18" fill="#ea580c" font-size="12" font-weight="800" text-anchor="middle">BEST 1위</text>
        </g>

        <!-- Stylized Skincare Device Artwork -->
        <g transform="translate(440, 30)">
          <!-- Base / Handle -->
          <rect x="30" y="40" width="46" height="150" rx="23" fill="url(#glow-device)" stroke="#cbd5e1" stroke-width="1.5" />
          <!-- Head / Ring -->
          <circle cx="53" cy="40" r="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
          <circle cx="53" cy="40" r="24" fill="#f8fafc" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,2" />
          <!-- Light Rays -->
          <circle cx="53" cy="40" r="15" fill="#ffe4e6" />
          <!-- Power LED -->
          <circle cx="53" cy="100" r="4" fill="#2563eb" />
          <line x1="43" y1="130" x2="63" y2="130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        </g>
      </g>

      <!-- Product Information Area -->
      <g transform="translate(32, 280)">
        <!-- Brand -->
        <text x="0" y="0" fill="#2563eb" font-size="12" font-weight="700" letter-spacing="0.5">GLOWBEAM · 글로우빔</text>

        <!-- Product Name -->
        <text x="0" y="28" fill="#111827" font-size="20" font-weight="900">글로우빔 미니 LED 스킨케어 디바이스</text>

        <!-- Rating & Reviews -->
        <g transform="translate(0, 48)">
          <text x="0" y="0" fill="#eab308" font-size="13" font-weight="700">★ 4.8</text>
          <text x="44" y="0" fill="#64748b" font-size="12" font-weight="500">리뷰 1,204건</text>
          <text x="130" y="0" fill="#cbd5e1">|</text>
          <text x="144" y="0" fill="#16a34a" font-size="12" font-weight="700">당일 출고</text>
        </g>

        <!-- Price Section -->
        <g transform="translate(0, 88)">
          <text x="0" y="0" fill="#ef4444" font-size="24" font-weight="900">32%</text>
          <text x="64" y="0" fill="#111827" font-size="24" font-weight="900">129,000원</text>
          <text x="214" y="-2" fill="#9ca3af" font-size="14" text-decoration="line-through">189,000원</text>
        </g>

        <!-- Hooking Benefit Box -->
        <g transform="translate(0, 108)">
          <rect width="608" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
          <text x="16" y="26" fill="#0f172a" font-size="13" font-weight="800">"하루 5분, 피부과 갈바닉 케어를 집에서 그대로"</text>
          <text x="16" y="46" fill="#64748b" font-size="12" font-weight="400">3파장 컬러 테라피(레드/블루/옐로우)로 탄력부터 진정까지 한번에 케어하세요.</text>
        </g>

        <!-- 4 Key Feature Icons -->
        <g transform="translate(0, 188)">
          <!-- Icon 1 -->
          <g transform="translate(0, 0)">
            <rect width="144" height="66" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
            <text x="14" y="26" fill="#2563eb" font-size="12" font-weight="700">✓ 저자극 인증</text>
            <text x="14" y="46" fill="#64748b" font-size="11">피부과 시험 완료</text>
          </g>

          <!-- Icon 2 -->
          <g transform="translate(154, 0)">
            <rect width="144" height="66" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
            <text x="14" y="26" fill="#2563eb" font-size="12" font-weight="700">⚡ 무선 고속충전</text>
            <text x="14" y="46" fill="#64748b" font-size="11">거치대 기본 제공</text>
          </g>

          <!-- Icon 3 -->
          <g transform="translate(308, 0)">
            <rect width="144" height="66" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
            <text x="14" y="26" fill="#2563eb" font-size="12" font-weight="700">🎛 3단계 조절</text>
            <text x="14" y="46" fill="#64748b" font-size="11">원터치 강도 세팅</text>
          </g>

          <!-- Icon 4 -->
          <g transform="translate(462, 0)">
            <rect width="144" height="66" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
            <text x="14" y="26" fill="#2563eb" font-size="12" font-weight="700">🛡 1년 무상 A/S</text>
            <text x="14" y="46" fill="#64748b" font-size="11">본사 직영 품질보증</text>
          </g>
        </g>

        <!-- CTA Buy Button -->
        <g transform="translate(0, 272)">
          <rect width="608" height="46" rx="10" fill="#2563eb" />
          <text x="304" y="29" fill="#ffffff" font-size="14.5" font-weight="800" text-anchor="middle">지금 32% 할인가로 구매하기 (무료배송)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
