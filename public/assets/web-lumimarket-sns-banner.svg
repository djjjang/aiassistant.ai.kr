<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" style="background:#fdf7f0; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9f3" />
      <stop offset="40%" stop-color="#fdf4ea" />
      <stop offset="100%" stop-color="#f8e5d3" />
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb" />
      <stop offset="100%" stop-color="#fce8d5" />
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8e8" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <linearGradient id="card-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#faebd7" />
    </linearGradient>

    <linearGradient id="cta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a34407" />
      <stop offset="100%" stop-color="#883304" />
    </linearGradient>

    <filter id="btn-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#883304" flood-opacity="0.32" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="url(#bg-warm)" />

  <!-- Organic Warm Graphic Circles -->
  <!-- Top Right Large Cream Circle -->
  <circle cx="950" cy="80" r="280" fill="#ffffff" opacity="0.6" />
  <circle cx="900" cy="140" r="180" fill="#fed7aa" opacity="0.25" />

  <!-- Bottom Left Soft Apricot Arc -->
  <circle cx="100" cy="880" r="320" fill="#fbd38d" opacity="0.35" />
  <circle cx="0" cy="980" r="260" fill="#f6ad55" opacity="0.25" />

  <!-- TOP HEADER -->
  <!-- Brand Logo -->
  <g transform="translate(60, 52)">
    <circle cx="17" cy="17" r="17" fill="#963d08" />
    <text x="17" y="22" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">루</text>
    <text x="44" y="23" fill="#1c1917" font-size="18" font-weight="800" letter-spacing="-0.5">루미마켓</text>
  </g>

  <!-- Season Off Badge -->
  <g transform="translate(840, 56)">
    <rect width="100" height="32" rx="16" fill="#ffffff" stroke="#f0ece6" stroke-width="1" />
    <text x="50" y="21" fill="#963d08" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">SEASON OFF</text>
  </g>

  <!-- MAIN EVENT COPY -->
  <g transform="translate(500, 250)" text-anchor="middle">
    <!-- Subtitle Category -->
    <text x="0" y="0" fill="#963d08" font-size="21" font-weight="800" letter-spacing="0.5">가을 시즌오프</text>

    <!-- Main Headline Line 1 -->
    <text x="0" y="74" fill="#1c1917" font-size="56" font-weight="900" letter-spacing="-1">전 품목</text>

    <!-- Main Headline Line 2 -->
    <text x="0" y="148" fill="#1c1917" font-size="70" font-weight="900" letter-spacing="-1.5">최대 50% OFF</text>

    <!-- Event Period Date -->
    <text x="0" y="208" fill="#57534e" font-size="18" font-weight="600">10.1 (목) — 10.7 (수) · 7일간</text>
  </g>

  <!-- 3 PRODUCT SHOWCASE CARDS -->
  <g transform="translate(60, 570)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="280" height="152" rx="18" fill="url(#card-grad-1)" />
      <!-- Subtle interior accent -->
      <rect x="16" y="16" width="248" height="120" rx="12" fill="#ffffff" opacity="0.35" />
      <text x="140" y="82" fill="#963d08" font-size="14" font-weight="700" text-anchor="middle" opacity="0.6">LIVING &amp; DECOR</text>
    </g>

    <!-- Card 2 (Center) -->
    <g transform="translate(300, 0)" filter="url(#card-shadow)">
      <rect width="280" height="152" rx="18" fill="url(#card-grad-2)" />
      <rect x="16" y="16" width="248" height="120" rx="12" fill="#ffffff" opacity="0.35" />
      <text x="140" y="82" fill="#963d08" font-size="14" font-weight="700" text-anchor="middle" opacity="0.6">KITCHEN &amp; TABLE</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(600, 0)" filter="url(#card-shadow)">
      <rect width="280" height="152" rx="18" fill="url(#card-grad-3)" />
      <rect x="16" y="16" width="248" height="120" rx="12" fill="#ffffff" opacity="0.35" />
      <text x="140" y="82" fill="#963d08" font-size="14" font-weight="700" text-anchor="middle" opacity="0.6">FASHION &amp; ACC</text>
    </g>
  </g>

  <!-- CALL TO ACTION BUTTON -->
  <g transform="translate(500, 810)" filter="url(#btn-shadow)">
    <g transform="translate(-105, 0)">
      <rect width="210" height="52" rx="26" fill="url(#cta-grad)" />
      <text x="105" y="32" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">지금 쇼핑하기 →</text>
    </g>
  </g>

  <!-- BOTTOM DISCLAIMER -->
  <text x="500" y="930" fill="#8c827a" font-size="12" font-weight="500" text-anchor="middle">
    일부 상품 제외 · 쿠폰 중복 적용 불가 · 자세한 내용은 스토어에서 확인
  </text>
</svg>
