<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" width="100%" height="100%">
  <defs>
    <style>
      @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
      text {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
    </style>
    <filter id="card-shadow" x="-5%" y="-3%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1060" fill="#f8fafc" />

  <!-- Top Navigation / Application Header -->
  <g transform="translate(0, 0)">
    <!-- App Logo Icon -->
    <rect x="40" y="24" width="40" height="40" rx="9" fill="#2563eb" />
    <text x="60" y="49" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="-0.5">T24</text>

    <!-- Header Title & Subtitle -->
    <text x="92" y="42" fill="#0f172a" font-size="17" font-weight="800">AI 협찬 제안 메일 작성</text>
    <text x="92" y="60" fill="#64748b" font-size="11.5" font-weight="500">Outreach Email Studio · 트렌드24 업무대행</text>

    <!-- Sent Status Badge & Date -->
    <rect x="795" y="29" width="90" height="28" rx="14" fill="#dcfce7" />
    <!-- Checkmark Icon -->
    <g transform="translate(807, 36)">
      <circle cx="7" cy="7" r="6" fill="#16a34a" />
      <path d="M4.5 7 L6.2 8.8 L9.8 4.8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
    <text x="828" y="47" fill="#15803d" font-size="11" font-weight="700">발송 완료</text>
    <text x="898" y="48" fill="#64748b" font-size="12" font-weight="500">2026.09.22</text>
  </g>

  <!-- Main Mail Card -->
  <rect x="70" y="98" width="860" height="885" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />

  <!-- Card Header Fields -->
  <g transform="translate(0, 0)">
    <!-- Recipient Row -->
    <text x="105" y="146" fill="#64748b" font-size="13" font-weight="600">받는사람</text>
    
    <!-- Recipient Pill Tag -->
    <rect x="190" y="127" width="248" height="32" rx="16" fill="#f1f5f9" />
    <circle cx="207" cy="143" r="9.5" fill="#f43f5e" />
    <text x="207" y="147" fill="#ffffff" font-size="9.5" font-weight="800" text-anchor="middle">하</text>
    <text x="225" y="147" fill="#0f172a" font-size="12.5" font-weight="700">하은글로우</text>
    <text x="286" y="147" fill="#64748b" font-size="11.5" font-weight="500">· 인스타그램 팔로워 8.2만</text>

    <!-- Subject Row -->
    <text x="105" y="187" fill="#64748b" font-size="13" font-weight="600">제목</text>
    <text x="190" y="188" fill="#0f172a" font-size="14.5" font-weight="800" letter-spacing="-0.3">
      [공동 프로젝트 제안] 글로우빔(GlowBeam) LED 스킨케어 디바이스 브랜드 협업 제안드립니다
    </text>

    <!-- Top Divider Line -->
    <line x1="70" y1="216" x2="930" y2="216" stroke="#f1f5f9" stroke-width="1.5" />
  </g>

  <!-- Mail Body Content -->
  <g transform="translate(0, 0)">
    <!-- Greetings -->
    <text x="105" y="254" fill="#0f172a" font-size="13.5" font-weight="600">안녕하세요, 하은님!</text>
    <text x="105" y="278" fill="#334155" font-size="13" font-weight="400">
      평소 정제된 뷰티 콘텐츠와 솔직한 리뷰로 많은 분들께 신뢰받고 계신 모습을 인상 깊게 보고 이렇게 연락드립니다.
    </text>

    <!-- Paragraph 2 -->
    <text x="105" y="324" fill="#334155" font-size="13" font-weight="400">
      저희는 홈케어 LED 스킨케어 디바이스 브랜드 <tspan font-weight="800" fill="#0f172a">글로우빔(GlowBeam)</tspan>을 운영하는 글로우빔코리아입니다. 하은님의 피드 톤과 팔로워분들의
    </text>
    <text x="105" y="347" fill="#334155" font-size="13" font-weight="400">
      스킨케어 관심도가 저희 브랜드와 잘 맞는다고 생각되어 협업을 제안드리게 되었습니다.
    </text>

    <!-- Section 1: Proposal Details -->
    <circle cx="109" cy="392" r="3" fill="#ef4444" />
    <text x="120" y="396" fill="#0f172a" font-size="13.5" font-weight="800">제안 내용</text>

    <!-- Proposal Details Rounded Box -->
    <rect x="105" y="412" width="790" height="142" rx="10" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1" />
    
    <g transform="translate(0, 0)">
      <!-- Item 1: 제품 -->
      <text x="130" y="440" fill="#64748b" font-size="12.5" font-weight="600">제품</text>
      <text x="215" y="440" fill="#0f172a" font-size="12.5" font-weight="500">글로우빔 프로 LED 마스크 (정가 189,000원)</text>

      <!-- Item 2: 협업 형태 -->
      <text x="130" y="465" fill="#64748b" font-size="12.5" font-weight="600">협업 형태</text>
      <text x="215" y="465" fill="#0f172a" font-size="12.5" font-weight="500">제품 협찬 (원고료 별도 협의 가능)</text>

      <!-- Item 3: 콘텐츠 -->
      <text x="130" y="490" fill="#64748b" font-size="12.5" font-weight="600">콘텐츠</text>
      <text x="215" y="490" fill="#0f172a" font-size="12.5" font-weight="500">인스타그램 피드 1건 + 릴스 1건, 스토리 2회 이상</text>

      <!-- Item 4: 업로드 일정 -->
      <text x="130" y="515" fill="#64748b" font-size="12.5" font-weight="600">업로드 일정</text>
      <text x="215" y="515" fill="#0f172a" font-size="12.5" font-weight="500">제품 수령 후 2주 이내</text>

      <!-- Item 5: 필수 표기 -->
      <text x="130" y="540" fill="#64748b" font-size="12.5" font-weight="600">필수 표기</text>
      <text x="215" y="540" fill="#0f172a" font-size="12.5" font-weight="500">@glowbeam_official 태그, #글로우빔 #GlowBeam #유료광고포함</text>
    </g>

    <!-- Section 2: Benefits -->
    <circle cx="109" cy="585" r="3" fill="#ef4444" />
    <text x="120" y="589" fill="#0f172a" font-size="13.5" font-weight="800">제공 혜택</text>

    <!-- Benefit Checkpoints -->
    <g transform="translate(0, 0)">
      <!-- Check 1 -->
      <path d="M109 611 L113 615 L121 606" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="130" y="613" fill="#334155" font-size="13" font-weight="500">제품 무상 제공 (정가 189,000원 상당)</text>

      <!-- Check 2 -->
      <path d="M109 635 L113 639 L121 630" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="130" y="637" fill="#334155" font-size="13" font-weight="500">전용 할인코드 발급 (팔로워 대상 15% 할인)</text>

      <!-- Check 3 -->
      <path d="M109 659 L113 663 L121 654" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="130" y="661" fill="#334155" font-size="13" font-weight="500">판매 연동 시 별도 리워드 지급 (선택)</text>
    </g>

    <!-- Closing Remarks -->
    <text x="105" y="700" fill="#334155" font-size="13" font-weight="400">
      관심 있으시면 회신 주세요. 상세 가이드라인과 협찬 계약서를 바로 보내드리겠습니다. 궁금하신 점은 편하게 문의 주시고요.
    </text>

    <text x="105" y="736" fill="#334155" font-size="13" font-weight="400">감사합니다 :)</text>

    <!-- Sign-off Block -->
    <text x="105" y="776" fill="#0f172a" font-size="13" font-weight="600">이서연 드림</text>
    <text x="105" y="796" fill="#64748b" font-size="12" font-weight="400">글로우빔코리아 마케팅팀</text>
    <text x="105" y="814" fill="#64748b" font-size="12" font-weight="400">marketing@glowbeam.co.kr · 02-1234-5678</text>
  </g>

  <!-- Card Action Footer -->
  <g transform="translate(0, 0)">
    <!-- Bottom Divider Line -->
    <line x1="70" y1="838" x2="930" y2="838" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Attachment 1: 브랜드소개서 -->
    <rect x="105" y="853" width="176" height="34" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- Paperclip icon -->
    <g transform="translate(118, 862)">
      <path d="M4 8.5 L8.5 4 C9.6 2.9 11.4 2.9 12.5 4 C13.6 5.1 13.6 6.9 12.5 8 L6.5 14 C5.7 14.8 4.3 14.8 3.5 14 C2.7 13.2 2.7 11.8 3.5 11 L9.5 5" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" fill="none" />
    </g>
    <text x="138" y="875" fill="#334155" font-size="11.5" font-weight="600">글로우빔_브랜드소개서.pdf</text>

    <!-- Attachment 2: 협찬가이드라인 -->
    <rect x="290" y="853" width="138" height="34" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- Paperclip icon -->
    <g transform="translate(303, 862)">
      <path d="M4 8.5 L8.5 4 C9.6 2.9 11.4 2.9 12.5 4 C13.6 5.1 13.6 6.9 12.5 8 L6.5 14 C5.7 14.8 4.3 14.8 3.5 14 C2.7 13.2 2.7 11.8 3.5 11 L9.5 5" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" fill="none" />
    </g>
    <text x="323" y="875" fill="#334155" font-size="11.5" font-weight="600">협찬가이드라인.pdf</text>

    <!-- Send Button (Coral Red) -->
    <rect x="806" y="852" width="92" height="36" rx="8" fill="#d9534f" />
    <text x="827" y="875" fill="#ffffff" font-size="13" font-weight="700">보내기</text>
    <!-- Paper Airplane Icon -->
    <g transform="translate(867, 862)">
      <path d="M1 5.5 L12 0.5 L8.5 11.5 L5.5 7.5 L1 5.5 Z" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" />
      <path d="M12 0.5 L5.5 7.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Outer Footer Subtitle -->
  <text x="930" y="1015" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="end">
    AI 협찬 제안 메일 작성 · 트렌드24 업무대행
  </text>
</svg>