<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" style="background:#8f98a3; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="modal-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
    <linearGradient id="modal-top-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0" />
      <stop offset="60%" stop-color="#fff8ed" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="popup-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a34407" />
      <stop offset="100%" stop-color="#883304" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND: DIMMED STORE VIEW -->
  <!-- Top Nav Bar (Muted) -->
  <rect width="1000" height="60" fill="#e2e6eb" opacity="0.85" />
  <g transform="translate(48, 16)" opacity="0.45">
    <circle cx="14" cy="14" r="14" fill="#963d08" />
    <text x="36" y="19" fill="#1e293b" font-size="14" font-weight="700">루미마켓</text>
  </g>
  <rect x="760" y="24" width="190" height="12" rx="6" fill="#cbd5e1" opacity="0.5" />

  <!-- Muted Store Product Cards in Background -->
  <g opacity="0.35" transform="translate(48, 90)">
    <rect x="0" y="0" width="288" height="140" rx="14" fill="#cbd5e1" />
    <rect x="308" y="0" width="288" height="140" rx="14" fill="#cbd5e1" />
    <rect x="616" y="0" width="288" height="140" rx="14" fill="#cbd5e1" />
    <rect x="0" y="160" width="288" height="140" rx="14" fill="#cbd5e1" />
    <rect x="308" y="160" width="288" height="140" rx="14" fill="#cbd5e1" />
    <rect x="616" y="160" width="288" height="140" rx="14" fill="#cbd5e1" />
  </g>

  <!-- DIM OVERLAY -->
  <rect width="1000" height="1000" fill="#1e293b" opacity="0.25" />

  <!-- CENTER POPUP MODAL DIALOG (width: 480, height: 530) -->
  <g transform="translate(260, 235)" filter="url(#modal-shadow)">
    <!-- Modal Base Container -->
    <rect width="480" height="530" rx="24" fill="#ffffff" />

    <!-- Top Decorative Header Fill -->
    <path d="M0 24C0 10.7452 10.7452 0 24 0H456C469.255 0 480 10.7452 480 24V190H0V24Z" fill="url(#modal-top-bg)" />

    <!-- Close Button (X) at Top Right -->
    <g transform="translate(432, 22)">
      <circle cx="12" cy="12" r="12" fill="#ffffff" opacity="0.8" stroke="#e2e8f0" stroke-width="1" />
      <path d="M8 8L16 16M16 8L8 16" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Gift Box Illustration Badge in Center -->
    <g transform="translate(240, 95)">
      <!-- Soft White Circular Aura -->
      <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#fef3c7" stroke-width="2" />

      <!-- Gift Box Graphic -->
      <g transform="translate(-20, -22)">
        <!-- Box Base (Warm Yellow/Gold) -->
        <rect x="4" y="14" width="32" height="26" rx="4" fill="#f59e0b" />
        <rect x="2" y="10" width="36" height="7" rx="3" fill="#fbbf24" />

        <!-- Red Ribbons -->
        <!-- Vertical Ribbon -->
        <rect x="17" y="10" width="6" height="30" fill="#dc2626" />
        <!-- Horizontal Ribbon -->
        <rect x="4" y="24" width="32" height="6" fill="#dc2626" />

        <!-- Red Bow on Top -->
        <circle cx="15" cy="8" r="5" fill="none" stroke="#dc2626" stroke-width="3" />
        <circle cx="25" cy="8" r="5" fill="none" stroke="#dc2626" stroke-width="3" />
        <circle cx="20" cy="9" r="3.5" fill="#ef4444" />
      </g>
    </g>

    <!-- Content Body -->
    <g transform="translate(44, 215)">
      <!-- Welcome Offer Tag -->
      <text x="196" y="0" fill="#963d08" font-size="12" font-weight="800" letter-spacing="1" text-anchor="middle">WELCOME OFFER</text>

      <!-- Main Headline (2 lines) -->
      <text x="196" y="32" fill="#0f172a" font-size="22" font-weight="900" letter-spacing="-0.5" text-anchor="middle">첫 구매 회원가입하고</text>
      <text x="196" y="60" fill="#0f172a" font-size="22" font-weight="900" letter-spacing="-0.5" text-anchor="middle">15% 할인쿠폰 받기</text>

      <!-- Subtitle Description -->
      <text x="196" y="94" fill="#64748b" font-size="12.5" font-weight="500" text-anchor="middle">
        지금 이메일만 남기면 즉시 발급, 전 상품 적용 가능한 쿠폰을 드려요
      </text>

      <!-- Email Input Form Field -->
      <g transform="translate(0, 126)">
        <rect width="392" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="16" y="31" fill="#94a3b8" font-size="13.5" font-weight="500">이메일 주소를 입력하세요</text>
      </g>

      <!-- CTA Button: 쿠폰 받기 -->
      <g transform="translate(0, 188)">
        <rect width="392" height="52" rx="10" fill="url(#popup-btn-grad)" />
        <text x="196" y="32" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">쿠폰 받기</text>
      </g>

      <!-- Secondary Link: 다음에 할게요 -->
      <text x="196" y="272" fill="#64748b" font-size="12.5" font-weight="600" text-anchor="middle">
        다음에 할게요
      </text>
    </g>
  </g>
</svg>
