<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#f8fafc; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- TOP HEADER -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  
  <!-- Logo / T24 badge -->
  <rect x="32" y="16" width="32" height="32" rx="8" fill="#2563eb" />
  <text x="48" y="37" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="-0.5">T24</text>
  
  <!-- Header Title -->
  <text x="76" y="32" fill="#111827" font-size="15" font-weight="700">AI 문서 자동 정리</text>
  <text x="76" y="46" fill="#6b7280" font-size="11" font-weight="500">Document Auto-Summary Studio · 트렌드24 업무대행</text>

  <!-- Status & Date -->
  <g transform="translate(994, 20)">
    <rect x="0" y="0" width="118" height="24" rx="12" fill="#dcfce7" />
    <path d="M12 12l2.5 2.5 5-5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="16" fill="#15803d" font-size="11" font-weight="700">정리 완료 · 4건</text>
    <text x="132" y="16" fill="#6b7280" font-size="12" font-weight="500">2026.09.23</text>
  </g>

  <!-- MAIN BODY -->
  <!-- LEFT COLUMN: 업로드 문서함 (width: 260) -->
  <g transform="translate(32, 88)">
    <text x="0" y="18" fill="#111827" font-size="15" font-weight="800">업로드 문서함</text>
    <rect x="224" y="4" width="36" height="20" rx="10" fill="#e0f2fe" />
    <text x="242" y="18" fill="#0284c7" font-size="11" font-weight="700" text-anchor="middle">4건</text>

    <!-- Document 1 (Selected): 9월 마케팅 전략 회의록 -->
    <g transform="translate(0, 32)">
      <rect width="260" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <rect x="14" y="14" width="46" height="20" rx="6" fill="#dbeafe" />
      <text x="37" y="28" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">회의록</text>
      <text x="246" y="28" fill="#9ca3af" font-size="11" text-anchor="end">2026.09.18</text>
      <text x="14" y="56" fill="#111827" font-size="13" font-weight="700">9월 마케팅 전략 회의록</text>
    </g>

    <!-- Document 2: Q3 콘텐츠 기획안 -->
    <g transform="translate(0, 118)">
      <rect width="260" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
      <rect x="14" y="14" width="76" height="20" rx="6" fill="#f3e8ff" />
      <text x="52" y="28" fill="#9333ea" font-size="11" font-weight="700" text-anchor="middle">보고서 · 기획안</text>
      <text x="246" y="28" fill="#9ca3af" font-size="11" text-anchor="end">2026.09.15</text>
      <text x="14" y="56" fill="#374151" font-size="13" font-weight="600">Q3 콘텐츠 기획안</text>
    </g>

    <!-- Document 3: 신제품 런칭 회의록 -->
    <g transform="translate(0, 204)">
      <rect width="260" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
      <rect x="14" y="14" width="46" height="20" rx="6" fill="#dbeafe" />
      <text x="37" y="28" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">회의록</text>
      <text x="246" y="28" fill="#9ca3af" font-size="11" text-anchor="end">2026.09.10</text>
      <text x="14" y="56" fill="#374151" font-size="13" font-weight="600">신제품 런칭 회의록</text>
    </g>

    <!-- Document 4: 4분기 사업 계획 보고서 -->
    <g transform="translate(0, 290)">
      <rect width="260" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
      <rect x="14" y="14" width="76" height="20" rx="6" fill="#f3e8ff" />
      <text x="52" y="28" fill="#9333ea" font-size="11" font-weight="700" text-anchor="middle">보고서 · 기획안</text>
      <text x="246" y="28" fill="#9ca3af" font-size="11" text-anchor="end">2026.09.02</text>
      <text x="14" y="56" fill="#374151" font-size="13" font-weight="600">4분기 사업 계획 보고서</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: 문서 요약 및 액션 아이템 결과 (width: 864) -->
  <g transform="translate(312, 88)">
    <text x="0" y="18" fill="#111827" font-size="16" font-weight="800">9월 마케팅 전략 회의록</text>
    <rect x="160" y="4" width="92" height="20" rx="10" fill="#dcfce7" />
    <text x="206" y="18" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">자동 요약 완료</text>

    <!-- Card Window -->
    <g transform="translate(0, 32)" filter="url(#card-shadow)">
      <rect width="864" height="600" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />

      <!-- Document Metadata Bar -->
      <g transform="translate(24, 28)">
        <text x="0" y="14" fill="#6b7280" font-size="13" font-weight="500">파일명</text>
        <text x="44" y="14" fill="#374151" font-size="13" font-weight="600">9월_마케팅전략회의_recording.docx</text>
        <line x1="316" y1="2" x2="316" y2="18" stroke="#e5e7eb" stroke-width="1" />
        <text x="336" y="14" fill="#374151" font-size="13" font-weight="600">3페이지</text>
        <line x1="400" y1="2" x2="400" y2="18" stroke="#e5e7eb" stroke-width="1" />
        <text x="420" y="14" fill="#374151" font-size="13" font-weight="600">참석자 5명</text>
      </g>
      <line x1="0" y1="64" x2="864" y2="64" stroke="#f1f5f9" stroke-width="1" />

      <!-- Section 1: 핵심 요약 -->
      <g transform="translate(24, 94)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="800">핵심 요약</text>

        <!-- Bullet 1 -->
        <circle cx="6" cy="30" r="3.5" fill="#2563eb" />
        <text x="18" y="34" fill="#374151" font-size="13" font-weight="500">4분기 마케팅 예산을 15% 증액해 인플루언서 협업을 확대하기로 결정</text>

        <!-- Bullet 2 -->
        <circle cx="6" cy="62" r="3.5" fill="#2563eb" />
        <text x="18" y="66" fill="#374151" font-size="13" font-weight="500">신규 채널로 유튜브 숏폼 콘텐츠를 주 2회 업로드하기로 시작</text>

        <!-- Bullet 3 -->
        <circle cx="6" cy="94" r="3.5" fill="#2563eb" />
        <text x="18" y="98" fill="#374151" font-size="13" font-weight="500">기존 블로그 SEO 키워드 전략은 유지하되, 10월부터 A/B 테스트 진행</text>
      </g>

      <!-- Section 2: 액션 아이템 -->
      <g transform="translate(24, 252)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="800">액션 아이템</text>

        <g transform="translate(0, 16)">
          <rect width="816" height="136" rx="12" fill="#f1f5f9" />

          <!-- Row 1 -->
          <g transform="translate(20, 24)">
            <rect x="0" y="0" width="16" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <text x="28" y="13" fill="#1f2937" font-size="13" font-weight="500">인플루언서 리스트업 및 컨택</text>
            <rect x="710" y="-2" width="46" height="20" rx="4" fill="#dbeafe" />
            <text x="733" y="12" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">김지수</text>
            <text x="778" y="12" fill="#64748b" font-size="12" font-weight="500">~9/25</text>
          </g>

          <!-- Row 2 -->
          <g transform="translate(20, 64)">
            <rect x="0" y="0" width="16" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <text x="28" y="13" fill="#1f2937" font-size="13" font-weight="500">유튜브 숏폼 기획안 초안 작성</text>
            <rect x="710" y="-2" width="46" height="20" rx="4" fill="#dbeafe" />
            <text x="733" y="12" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">박서준</text>
            <text x="778" y="12" fill="#64748b" font-size="12" font-weight="500">~9/30</text>
          </g>

          <!-- Row 3 -->
          <g transform="translate(20, 104)">
            <rect x="0" y="0" width="16" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <text x="28" y="13" fill="#1f2937" font-size="13" font-weight="500">예산 증액안 대표 보고</text>
            <rect x="710" y="-2" width="46" height="20" rx="4" fill="#dbeafe" />
            <text x="733" y="12" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">이민아</text>
            <text x="778" y="12" fill="#64748b" font-size="12" font-weight="500">~9/22</text>
          </g>
        </g>
      </g>

      <!-- Section 3: 키워드 태그 -->
      <g transform="translate(24, 444)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="800">키워드 태그</text>

        <g transform="translate(0, 14)">
          <!-- Tag 1 -->
          <rect x="0" y="0" width="84" height="28" rx="14" fill="#f1f5f9" />
          <text x="42" y="18" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">#마케팅전략</text>

          <!-- Tag 2 -->
          <rect x="92" y="0" width="82" height="28" rx="14" fill="#f1f5f9" />
          <text x="133" y="18" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">#인플루언서</text>

          <!-- Tag 3 -->
          <rect x="182" y="0" width="86" height="28" rx="14" fill="#f1f5f9" />
          <text x="225" y="18" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">#유튜브숏폼</text>

          <!-- Tag 4 -->
          <rect x="276" y="0" width="54" height="28" rx="14" fill="#f1f5f9" />
          <text x="303" y="18" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">#예산</text>

          <!-- Tag 5 -->
          <rect x="338" y="0" width="58" height="28" rx="14" fill="#f1f5f9" />
          <text x="367" y="18" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">#4분기</text>
        </g>
      </g>
    </g>
  </g>
</svg>
